# Per-target rustflags. Never a global `[build] rustflags` and never the
# `RUSTFLAGS` environment variable: both apply to every target at once and
# both invalidate the build cache between CI jobs that differ only in host
# architecture.
#
# Note that the `RUSTFLAGS` env var, if set, *replaces* everything below
# rather than adding to it. If a build behaves as though these flags are
# absent, check the environment first.

# --- aarch64-apple-darwin (M5 Max dev box, macos-latest CI) ----------------
#
# `+neon` is a VERIFIED NO-OP. NEON is mandatory in ARMv8-A and
# `rustc --print cfg --target aarch64-apple-darwin` already lists
# target_feature="neon" (along with aes, crc, dotprod, fp16, lse, sha3 and
# twenty more). It is written out anyway so the two targets read
# symmetrically and so nobody "adds NEON support" later believing it is
# missing. Nothing else is set: `target-cpu=apple-mN` would make the binary
# non-portable across the fleet's Apple silicon for no measured gain, and
# `target-cpu=native` would make builds differ by machine, which is
# incompatible with the bench determinism contract.
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-feature=+neon"]

# --- x86_64-unknown-linux-gnu (N305 bot/worker, ubuntu-latest CI) ---------
#
# The x86-64 baseline is sse2 ONLY (verified: `rustc --print cfg` for this
# target lists exactly fxsr, sse, sse2). In particular:
#
#   * `popcnt` is NOT baseline and is NOT implied by `+avx2`. Without it,
#     `u64::count_ones()` compiles to a software popcount, which for a
#     bitboard engine is a whole-engine slowdown, not a micro-optimisation.
#   * `bmi1` (tzcnt, blsr) is likewise not implied by `+avx2`.
#
# So the list is explicit rather than `+avx2` alone.
#
# `bmi2` is DELIBERATELY ABSENT. Not because the compiler would emit PEXT on
# its own (it would not) but because sliding attacks deliberately have one
# safe magic-table path, and a `+bmi2` sitting here reads as permission to add
# another. Adding it requires changing that design in the same commit.
#
# `target-cpu=x86-64-v3` would cover all of the above in one token and is
# tempting, but it also enables bmi2, fma and f16c. Named ISA levels hide
# exactly the decision this project needs kept visible.
#
# This checkout builds the AVX2 deployment tier. Generic and AVX-512 tiers
# cannot also live in this file: `[target.<triple>]` is keyed on the triple,
# and all three tiers share one triple. Selecting among them needs a
# build-time mechanism this file cannot express.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+avx2,+bmi1,+popcnt,+lzcnt"]

[alias]
xtask = "run --quiet --manifest-path xtask/Cargo.toml --"
