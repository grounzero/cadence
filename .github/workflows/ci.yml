          rc=0
          from_source unreleased none setup || rc=$?
          [ "$rc" -eq 0 ] || { cat unreleased.txt; bad "install.sh exited $rc building a version with no release files"; }
          said unreleased.txt "Version $v publishes no SHA256SUMS (not found), so it has no release to hold its source to, and it is built at its tag." \
            "install.sh did not say the version has no release to hold its source to"

          # A bench that counts other than bench.txt says is a mismatch, which stops the run as a
          # checksum does.
          rc=0
          env -u GITHUB_TOKEN -u GH_TOKEN GH_CONFIG_DIR="$nogh" CADENCE_RELEASES_URL="$url/badbench" bash install.sh --yes \
            --test-urls --version "$v" --dir "$tmp/badbench" > badbench.txt 2>&1 || rc=$?
          [ "$rc" -ne 0 ] || { cat badbench.txt; bad "install.sh installed a binary whose bench does not match"; }
          said badbench.txt "$RELEASE_FILE: its bench counts $(tr -d '[:space:]' < "$tmp/releases/good/$v/bench.txt") nodes and bench.txt says" \
            "install.sh did not say the bench does not match"
          said badbench.txt "The file may be corrupt, or tampered with on its way here" "install.sh did not say a bad bench may be tampering"
          if grep -qF 'Building from source' badbench.txt; then cat badbench.txt; bad "install.sh built from source after a bench mismatch"; fi
          [ ! -e "$tmp/badbench" ] || bad "a binary was installed after a bench mismatch"

          # A genuine binary served as another version: its attestation names the tag it was built at.
          if command -v gh > /dev/null; then
            rc=0
            CADENCE_RELEASES_URL="$url/renamed" bash install.sh --yes --test-urls --version 0.0.1 --dir "$tmp/renamed" \
              > renamed.txt 2>&1 || rc=$?
            [ "$rc" -ne 0 ] || { cat renamed.txt; bad "install.sh installed a binary attested for another version"; }
            said renamed.txt "$RENAMED_FILE's build attestation does not verify (" \
              "install.sh did not refuse an attestation made at another tag"
          fi

