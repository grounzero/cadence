# A dispatched comparison of the converter and datagen against main, on fixed seeds.
#
# Each head is built beside main, generates three chunks of packed games and converts them, and
# the job fails if any record file differs or a chunk differs past its header.

name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  identity:
    name: converter and datagen identity
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build main and each head
        run: |
          set -euo pipefail
          W=$RUNNER_TEMP/id
          mkdir -p "$W"
          git fetch --no-tags origin main converter-copies-cap converter-report-sample converter-copies-presize
          for pair in main=origin/main pr341=origin/converter-copies-cap pr342=origin/converter-report-sample pr344=origin/converter-copies-presize; do
            n=${pair%%=*}; ref=${pair#*=}
            git worktree add --detach "$W/src-$n" "$ref"
            echo "$n $(git rev-parse "$ref")" | tee -a "$W/refs.txt"
            (cd "$W/src-$n" && cargo build --locked --release -p cadence-engine --features packed-datagen && cargo build --locked --release -p cadence-tools)
          done

      - name: Bench per build against its bench.txt
        run: |
          set -euo pipefail
          W=$RUNNER_TEMP/id
          for n in main pr341 pr342 pr344; do
            got=$("$W/src-$n/target/release/cadence" bench | tail -1 | cut -d' ' -f1)
            want=$(tr -d '[:space:]' < "$W/src-$n/bench.txt")
            echo "$n bench $got nodes, bench.txt $want"
            [ "$got" = "$want" ] || { echo "::error::$n bench differs from its bench.txt"; exit 1; }
          done

      - name: Generate on fixed seeds with each build
        run: |
          set -euo pipefail
          W=$RUNNER_TEMP/id
          RUN_SEED=5bf31ae5db07b750
          for n in main pr341 pr342 pr344; do
            B=$W/src-$n/target/release/cadence
            out=$W/data-$n
            mkdir -p "$out"
            "$B" datagen run --out "$out" --run-seed "$RUN_SEED" --threads 4 --chunk-games 40 --host ci-identity > "$W/gen-$n.log" 2>&1 &
            pid=$!
            while [ ! -e "$out/$RUN_SEED-000002.cdg" ]; do
              kill -0 "$pid" 2> /dev/null || { cat "$W/gen-$n.log"; exit 1; }
              sleep 2
            done
            touch "$out/STOP"
            wait "$pid"
            rm -f "$out/STOP"
            find "$out" -name "$RUN_SEED-*" ! -name "$RUN_SEED-00000[012].cdg*" -print -delete
            "$B" datagen verify "$out" --threads 4 --manifest > "$W/verify-$n.log"
            tail -3 "$W/verify-$n.log"
            "$B" datagen play --games 20 --seed 6625669051316680528 --threads 4 --out "$W/play-$n.bin"
          done

      - name: Convert and compare
        run: |
          set -euo pipefail
          W=$RUNNER_TEMP/id
          RUN_SEED=5bf31ae5db07b750
          SHUFFLE=5bf31ae5db07b750
          fail=0
          conv() {
            local tool=$1 data=$2 out=$W/conv-$1-of-$2
            mkdir -p "$out"
            "$W/src-$tool/target/release/cadence-tools" convert --manifest "$W/data-$data/MANIFEST.tsv" --out "$out" --shuffle-seed "$SHUFFLE" > "$out.log" 2>&1 || { cat "$out.log"; return 1; }
            find "$out" -mindepth 1 -maxdepth 1 -type d
          }
          same() {
            if cmp -s "$1" "$2"; then echo "  identical: $(basename "$1") $(sha256sum < "$1" | cut -c1-16) $(stat -c %s "$1") bytes"
            else echo "::error::differs: $1 against $2"; fail=1; fi
          }
          base=$(conv main main)
          echo "main's converter over main's data: unit $(basename "$base")"
          for n in pr341 pr342 pr344; do
            echo "== $n against main"
            echo "datagen: chunk bytes"
            for i in 0 1 2; do
              a=$W/data-main/$RUN_SEED-00000$i.cdg; b=$W/data-$n/$RUN_SEED-00000$i.cdg
              [ "$(stat -c %s "$a")" = "$(stat -c %s "$b")" ] || { echo "::error::chunk $i sizes differ"; fail=1; continue; }
              diffs=$(cmp -l "$a" "$b" | wc -l || true)
              last=$(cmp -l "$a" "$b" | tail -1 | awk '{print $1}' || true)
              echo "  chunk $i: $(stat -c %s "$a") bytes, $diffs differ, the last at offset ${last:-none}"
              if [ -n "$last" ] && [ "$last" -gt 1024 ]; then echo "::error::chunk $i differs past its header"; fail=1; fi
            done
            echo "datagen play"
            same "$W/play-main.bin" "$W/play-$n.bin"
            echo "datagen: main's converter over this build's data"
            u=$(conv main "$n")
            same "$base/train.bin" "$u/train.bin"
            same "$base/holdout.bin" "$u/holdout.bin"
            echo "converter: this head's converter over main's data"
            u=$(conv "$n" main)
            echo "  unit $(basename "$u")"
            same "$base/train.bin" "$u/train.bin"
            same "$base/holdout.bin" "$u/holdout.bin"
            echo "  report.txt lines that differ:"; diff "$base/report.txt" "$u/report.txt" || true
            echo "  MANIFEST.tsv lines that differ:"; diff "$base/MANIFEST.tsv" "$u/MANIFEST.tsv" || true
          done
          echo "main's report:"; cat "$base/report.txt"
          exit $fail
