          # The real git is named before PATH puts the flaky one first, or the flaky one would call itself.
          rc=0
          mkdir -p "$tmp/flaky-git-home" "$tmp/flaky-git-marks"
          HOME="$tmp/flaky-git-home" USERPROFILE="$(cygpath -w "$tmp/flaky-git-home" 2> /dev/null || echo "$tmp/flaky-git-home")" \
            FAKE_GIT_REAL="$(command -v git)" PATH="$tmp/flaky-git:$tmp/fake-rust:$PATH" FAKE_GIT_MARKS="$tmp/flaky-git-marks" \
            FAKE_BUILT="$tmp/releases/good/$v/$RELEASE_FILE" FAKE_EXE=$exe FAKE_HOST=$RUST_HOST \
            CADENCE_API_URL="$url/forbidden/releases" bash install.sh --yes --test-urls --source \
            --version "$v" --dir "$tmp/flaky-git-dir" > flaky-git.txt 2>&1 || rc=$?
          [ "$rc" -eq 0 ] || { cat flaky-git.txt; bad "install.sh exited $rc where git failed once for the network"; }
          said flaky-git.txt "Listing the releases at https://github.com/grounzero/cadence.git failed, so it is tried once more in 3 seconds." \
            "install.sh did not try git ls-remote again"
          said flaky-git.txt "Fetching Cadence $v failed, so it is tried once more in 3 seconds." "install.sh did not try git fetch again"
          [ -e "$tmp/flaky-git-marks/ls-remote" ] && [ -e "$tmp/flaky-git-marks/fetch" ] || bad "the flaky git was not the one called"
          cmp "$tmp/flaky-git-dir/cadence$exe" "$tmp/releases/good/$v/$RELEASE_FILE" || bad "the stand-in build was not installed"
          # A toolchain install that fails installed nothing, so nothing is recorded for the uninstall to
          # name, though the build goes on.
          rc=0
          mkdir -p "$tmp/no-toolchain-home"
          HOME="$tmp/no-toolchain-home" USERPROFILE="$(cygpath -w "$tmp/no-toolchain-home" 2> /dev/null || echo "$tmp/no-toolchain-home")" \
            PATH="$tmp/fake-rust:$PATH" FAKE_RUSTUP_FAIL=1 FAKE_BUILT="$tmp/releases/good/$v/$RELEASE_FILE" FAKE_EXE=$exe \
            FAKE_HOST=$RUST_HOST CADENCE_API_URL="$url/forbidden/releases" bash install.sh --yes --test-urls --source \
            --version "$v" --dir "$tmp/no-toolchain" > no-toolchain.txt 2>&1 || rc=$?
          [ "$rc" -eq 0 ] || { cat no-toolchain.txt; bad "install.sh exited $rc where only the toolchain install failed"; }
          said no-toolchain.txt "This rustup installs the Rust version Cadence pins as the build starts instead." \
            "the stand-in toolchain install did not fail"
          if [ "$RUNNER_OS" != Windows ]; then
            state="$tmp/no-toolchain-home/.local/share/cadence/install-state"
            [ -f "$state" ] || bad "the install left no record"
            if grep -q '^installed_toolchain=' "$state"; then cat "$state"; bad "install.sh recorded a toolchain whose install failed"; fi
          fi
          # Finding the release: a refusal is the rate limit only where GitHub's answer says it is.
          for api in forbidden limited; do
            CADENCE_LATEST_URL="$url/latest/" CADENCE_API_URL="$url/$api/releases" bash install.sh --yes --test-urls \
              --dir "$tmp/find-$api" > "find-$api.txt" 2>&1 \
              && { cat "find-$api.txt"; bad "install.sh found a release through an API that refuses"; }
          done
          said find-forbidden.txt "could not read Cadence's releases from GitHub (the server answered 403)" "install.sh did not say the API refused"
          if grep -qF 'limits how often' find-forbidden.txt; then bad "install.sh called a 403 GitHub's rate limit without GitHub saying so"; fi
          said find-limited.txt "GitHub refused to name Cadence's releases (the server answered 403): it limits how often one address asks." \
            "install.sh did not name GitHub's rate limit where GitHub said so"

          # A build that cannot run here gives way to the tier below it, held to the same checks.
          if [ -d "$tmp/releases/illegal/$v" ]; then
            generic=$(tr -d '\r' < "$tmp/releases/illegal/$v/SHA256SUMS" | sed -n 's/^[0-9a-f]*  *\(cadence-.*-generic\(\.exe\)\{0,1\}\)$/\1/p')
            rc=0
            env -u GITHUB_TOKEN -u GH_TOKEN GH_CONFIG_DIR="$nogh" CADENCE_RELEASES_URL="$url/illegal" bash install.sh --yes \
              --test-urls --version "$v" --dir "$tmp/illegal" > illegal.txt 2>&1 || rc=$?
            [ "$rc" -eq 0 ] || { cat illegal.txt; bad "install.sh exited $rc where the generic build runs"; }
            said illegal.txt "$RELEASE_FILE cannot be used here: it stopped in its bench with exit" \
              "install.sh did not say the build stopped in its bench"
            said illegal.txt "The release's generic build, $generic, is tried in its place." "install.sh did not try the tier below"
            said illegal.txt "== Checking $generic" "install.sh did not check the generic build"
            if grep -qF 'Building from source' illegal.txt; then cat illegal.txt; bad "install.sh built from source where the generic build runs"; fi
            exe=""
            [ "$RUNNER_OS" != Windows ] || exe=.exe
            cmp "$tmp/illegal/cadence$exe" "$tmp/releases/illegal/$v/$generic" || bad "the generic build was not the one installed"
          else
            echo "::notice::no lower tier to give way to here"
          fi
          # A build whose bench is the release's but which crashes when asked uci cannot run here either,
          # so it gives way to the tier below it, and is not called corrupt.
          if [ -d "$tmp/releases/ucicrash/$v" ]; then
            generic=$(tr -d '\r' < "$tmp/releases/ucicrash/$v/SHA256SUMS" | sed -n 's/^[0-9a-f]*  *\(cadence-.*-generic\(\.exe\)\{0,1\}\)$/\1/p')
            rc=0
            env -u GITHUB_TOKEN -u GH_TOKEN GH_CONFIG_DIR="$nogh" CADENCE_RELEASES_URL="$url/ucicrash" bash install.sh --yes \
              --test-urls --version "$v" --dir "$tmp/ucicrash" > ucicrash.txt 2>&1 || rc=$?
            [ "$rc" -eq 0 ] || { cat ucicrash.txt; bad "install.sh exited $rc where the generic build runs after a crash at uci"; }
            said ucicrash.txt "$RELEASE_FILE cannot be used here: it stopped while answering uci with exit 139" \
              "install.sh did not say the build stopped while answering uci"
            said ucicrash.txt "The release's generic build, $generic, is tried in its place." "install.sh did not try the tier below"
            if grep -qF 'tampered with' ucicrash.txt; then cat ucicrash.txt; bad "install.sh called a crash at uci a corrupt file"; fi
            exe=""
            [ "$RUNNER_OS" != Windows ] || exe=.exe
            cmp "$tmp/ucicrash/cadence$exe" "$tmp/releases/ucicrash/$v/$generic" || bad "the generic build was not the one installed"
          fi
          # Where no tier runs, the run stops with its log kept, as for a binary the system refused, and
          # shows no line of the shell's own.
          if [ -d "$tmp/releases/noneruns/$v" ]; then
            rc=0
            env -u GITHUB_TOKEN -u GH_TOKEN GH_CONFIG_DIR="$nogh" CADENCE_RELEASES_URL="$url/noneruns" bash install.sh --yes \
              --test-urls --version "$v" --dir "$tmp/noneruns" > noneruns.txt 2>&1 || rc=$?
            [ "$rc" -ne 0 ] || { cat noneruns.txt; bad "install.sh installed where no tier runs"; }
            said noneruns.txt "The log is at " "install.sh did not keep the log where no tier runs"
            if grep -qE 'install\.sh: line|Illegal instruction|core dumped' noneruns.txt; then
              cat noneruns.txt
              bad "install.sh showed the shell's own line for a binary that stopped"
            fi
          fi

          # Through wget, a file the server does not have is not published, as through curl: the run says
          # so on the first answer, with no second try and no word of the network.
          if [ "$RUNNER_OS" = Linux ] && command -v wget > /dev/null; then
            nocurl="$tmp/no-curl"
            mkdir -p "$nocurl"
            for dir in /usr/local/bin /usr/bin /bin; do
              for f in "$dir"/*; do
                name=${f##*/}
                if [ "$name" != curl ] && [ ! -e "$nocurl/$name" ] && [ ! -L "$nocurl/$name" ]; then ln -s "$f" "$nocurl/$name"; fi
              done
            done
            rc=0
            env -u GITHUB_TOKEN -u GH_TOKEN GH_CONFIG_DIR="$nogh" PATH="$nocurl" CADENCE_RELEASES_URL="$url/none" \
              bash install.sh --yes --test-urls --version "$v" --dir "$tmp/wget-404" > wget-404.txt 2>&1 || rc=$?
            [ "$rc" -ne 0 ] || { cat wget-404.txt; bad "install.sh went on without a SHA256SUMS"; }
            said wget-404.txt "release $v publishes no checksum file (not found)" "install.sh did not read wget's 404 as not published"
            if grep -qE 'after trying twice|Check the network' wget-404.txt; then cat wget-404.txt; bad "install.sh took wget's 404 for the network"; fi
          fi

          # On macOS, bash reads the first of ~/.bash_profile, ~/.bash_login and ~/.profile, so where only
          # ~/.profile exists the PATH line goes there, and no ~/.bash_profile is made to hide it.
          if [ "$RUNNER_OS" = macOS ]; then
            home="$tmp/bash-profile-home"
            mkdir -p "$home"
            echo "# the user's own" > "$home/.profile"
            rc=0
            env -u GITHUB_TOKEN -u GH_TOKEN HOME="$home" SHELL=/bin/bash GH_CONFIG_DIR="$nogh" CADENCE_RELEASES_URL="$url/good" \
              bash install.sh --yes --test-urls --version "$v" > bash-profile.txt 2>&1 || rc=$?
            [ "$rc" -eq 0 ] || { cat bash-profile.txt; bad "install.sh exited $rc installing for bash"; }
            [ ! -e "$home/.bash_profile" ] || { cat bash-profile.txt; bad "install.sh made a ~/.bash_profile, which hides ~/.profile from bash"; }
            grep -qxF "export PATH=\"$home/.local/bin:\$PATH\"" "$home/.profile" \
              || { cat bash-profile.txt "$home/.profile"; bad "install.sh did not add the PATH line to ~/.profile"; }
          fi

          # An uninstall leaves nothing the install made behind: the profile file it created, the folders
          # it created for the binary, its record and its logs, and the logs of earlier runs.
          if [ "$RUNNER_OS" != Windows ]; then
            home="$tmp/leftover-home"
            mkdir -p "$home"
            for args in "" "--dir $tmp/made-for-it/deep/bin"; do
              rc=0
              # The stand-in gh, which keeps no cache in the home as the real one may.
              env -u GITHUB_TOKEN -u GH_TOKEN HOME="$home" SHELL=/bin/bash PATH="$tmp/fake-gh:$PATH" FAKE_GH=setup \
                FAKE_GH_ARGS="$tmp/gh-args" CADENCE_RELEASES_URL="$url/good" \
                bash install.sh --yes --test-urls --version "$v" $args > leftover-install.txt 2>&1 || rc=$?
              [ "$rc" -eq 0 ] || { cat leftover-install.txt; bad "install.sh exited $rc installing into a fresh home ($args)"; }
              printf 'an earlier run\n' > "$home/.cache/cadence/install-20000101-000000.log"
              rc=0
              env -u GITHUB_TOKEN -u GH_TOKEN HOME="$home" SHELL=/bin/bash PATH="$tmp/fake-gh:$PATH" \
                bash install.sh --yes --uninstall > leftover-uninstall.txt 2>&1 || rc=$?
              [ "$rc" -eq 0 ] || { cat leftover-uninstall.txt; bad "the uninstall exited $rc ($args)"; }
              left=$(cd "$home" && find . -mindepth 1 | sort | tr '\n' ' ')
              [ -z "$left" ] || { cat leftover-install.txt leftover-uninstall.txt; bad "the uninstall left behind: $left($args)"; }
            done
            [ ! -e "$tmp/made-for-it" ] || bad "the uninstall left the folders it made for --dir"
          fi

          # Without an install record, a file at the default path may not be this installer's, so --yes
          # alone does not remove it, and the uninstall says why.
          if [ "$RUNNER_OS" != Windows ]; then
            home="$tmp/no-record-home"
            mkdir -p "$home/.local/bin"
            printf 'built by hand\n' > "$home/.local/bin/cadence"
            rc=0
            env -u GITHUB_TOKEN -u GH_TOKEN HOME="$home" GH_CONFIG_DIR="$nogh" bash install.sh --yes --uninstall \
              > no-record.txt 2>&1 || rc=$?
            [ "$rc" -eq 0 ] || { cat no-record.txt; bad "the uninstall exited $rc with no record"; }
            [ -e "$home/.local/bin/cadence" ] || { cat no-record.txt; bad "the uninstall removed a file it has no record of, under --yes"; }
            said no-record.txt "There is no install record, so " "the uninstall did not say why it keeps the file"
          fi

          # A download that fails for the network is tried once more: each file's first answer of 503
          # is followed by the file, and a server that never answers stops the run after two tries.
          rc=0
          env -u GITHUB_TOKEN -u GH_TOKEN GH_CONFIG_DIR="$nogh" CADENCE_RELEASES_URL="$url/flaky" bash install.sh --yes \
            --test-urls --version "$v" --dir "$tmp/flaky" > flaky.txt 2>&1 || rc=$?
          [ "$rc" -eq 0 ] || { cat flaky.txt; bad "install.sh exited $rc where each file came at the second try"; }
          for f in SHA256SUMS "$RELEASE_FILE" bench.txt; do
            n=$(grep -cF "GET /flaky/$v/$f " "$tmp/serve.log" || true)
            [ "$n" = 2 ] || { cat "$tmp/serve.log"; bad "$f was asked for $n times, not twice"; }
          done
          rc=0
          CADENCE_RELEASES_URL=http://127.0.0.1:9 bash install.sh --yes --test-urls --version "$v" --dir "$tmp/offline" \
            > offline.txt 2>&1 || rc=$?
          [ "$rc" -ne 0 ] || { cat offline.txt; bad "install.sh went on without a server"; }
          said offline.txt "could not download release $v's SHA256SUMS (no connection to the server), after trying twice. Check the network connection" \
            "install.sh did not say the download failed twice for the network"
          if grep -qF 'Building from source' offline.txt; then cat offline.txt; bad "install.sh built from source when offline"; fi

          # Every release has a binary for this system, so a SHA256SUMS without a SHA-256 for it, whether
          # the entry is missing, is not a SHA-256 or the file is a web page, is damaged: the run stops,
          # and nothing is built from source in its place.
          for kind in nobinary malformed websums; do
            rc=0
            CADENCE_RELEASES_URL="$url/$kind" CADENCE_API_URL="$url/moved/releases" bash install.sh --yes --test-urls \
              --version "$v" --dir "$tmp/$kind" > "$kind.txt" 2>&1 || rc=$?
            [ "$rc" -ne 0 ] || { cat "$kind.txt"; bad "install.sh installed through a damaged SHA256SUMS ($kind)"; }
            said "$kind.txt" "Release $v's SHA256SUMS gives no SHA-256 for cadence-$v-" \
              "install.sh did not say the SHA256SUMS lacks the binary's SHA-256 ($kind)"
            said "$kind.txt" "which every release of $v has, so the file is damaged" "install.sh did not call the SHA256SUMS damaged ($kind)"
            said "$kind.txt" "The file may be corrupt, or tampered with on its way here" \
              "install.sh did not say the file may be tampered with ($kind)"
            if grep -qF 'Building from source' "$kind.txt"; then cat "$kind.txt"; bad "install.sh built from source for a damaged SHA256SUMS ($kind)"; fi
          done
          if grep -qF 'one build' install.sh plain.txt nobinary.txt; then bad "install.sh still says Cadence has one build"; fi
          case "$(uname -m)" in
            aarch64 | arm64) said install.txt "binary is the one for it." "install.sh did not name the release's binary for this system" ;;
          esac
          echo "every refusal held"

      - name: install.ps1 refuses what it must
        if: env.SCRIPT == 'install.ps1'
        shell: powershell
        run: |
          $releases = Join-Path $env:RUNNER_TEMP 'releases'
          $server = Start-Process -FilePath python -ArgumentList (Join-Path $env:RUNNER_TEMP 'serve.py'), '8712' `
            -WorkingDirectory $releases -PassThru -NoNewWindow `
            -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'serve.out') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'serve.log')
          function Install([string[]]$Arguments) {
            $out = & powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 @Arguments 2>&1 | Out-String
            return @{ Code = $LASTEXITCODE; Out = $out }
          }
          function Said($Run, [string]$Text, [string]$Why) {
            if (-not $Run.Out.Contains($Text)) { Write-Host $Run.Out; throw $Why }
          }
          try {
            $url = 'http://127.0.0.1:8712'
            $v = $env:RELEASE_VERSION
            $up = $false
            for ($n = 0; $n -lt 30 -and -not $up; $n++) {
              try { Invoke-WebRequest -UseBasicParsing -Uri "$url/good/$v/SHA256SUMS" -ErrorAction Stop | Out-Null; $up = $true } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $up) { throw 'the release folder is not served' }
            $tmp = $env:RUNNER_TEMP

            $env:CADENCE_RELEASES_URL = "$url/good"
            $run = Install @('--yes', '--version', $v, '--dir', (Join-Path $tmp 'plain'))
            if ($run.Code -eq 0) { Write-Host $run.Out; throw 'install.ps1 took release files over plain HTTP without --test-urls' }
            Said $run "CADENCE_RELEASES_URL is $url/good, which is not https://github.com/grounzero/cadence/releases/download;" 'the refusal of the URL does not say why'
            if (Test-Path (Join-Path $tmp 'plain')) { throw 'install.ps1 installed from a server it refused' }
            $env:CADENCE_RELEASES_URL = 'https://github.com/someone-else/x/releases/download'
            $run = Install @('--yes', '--version', $v, '--dir', (Join-Path $tmp 'plain'))
            if ($run.Code -eq 0) { Write-Host $run.Out; throw 'install.ps1 took release files from another repository on github.com' }
            Said $run 'which is not https://github.com/grounzero/cadence/releases/download; only a test may name another server' 'the refusal of another repository does not say why'
            Remove-Item Env:CADENCE_RELEASES_URL
            $env:CADENCE_LATEST_URL = "$url/latest/$v"
            $run = Install @('--yes', '--version', $v, '--dir', (Join-Path $tmp 'plain'))
            Remove-Item Env:CADENCE_LATEST_URL
            if ($run.Code -eq 0) { Write-Host $run.Out; throw 'install.ps1 took CADENCE_LATEST_URL without --test-urls' }
            Said $run 'CADENCE_LATEST_URL is set, which only a test may do, with --test-urls' "the refusal of the latest release's address does not say why"
            $env:CADENCE_API_URL = "$url/api-list/releases"
            $run = Install @('--yes', '--version', $v, '--dir', (Join-Path $tmp 'plain'))
            if ($run.Code -eq 0) { throw 'install.ps1 took CADENCE_API_URL without --test-urls' }
            Said $run 'CADENCE_API_URL is set, which only a test may do, with --test-urls' 'the refusal of the API does not say why'

            # The latest stable release is the one the redirect names, and the API, whose latest release is
            # another, is not asked for it.
            $env:CADENCE_RELEASES_URL = "$url/good"
            $env:CADENCE_LATEST_URL = "$url/latest/$v"
            $env:CADENCE_API_URL = "$url/api-known/releases"
            $run = Install @('--yes', '--test-urls', '--dir', (Join-Path $tmp 'latest'))
            if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 exited $($run.Code) installing the release the redirect names" }
            Said $run "GitHub's latest release is read from $url/latest/$v, as CADENCE_LATEST_URL and --test-urls ask." 'install.ps1 did not say where it reads the latest release'
            Said $run "The latest stable release is $v." 'install.ps1 did not take the release the redirect names'
            if ($run.Out.Contains('9.9.9')) { Write-Host $run.Out; throw "install.ps1 took the API's latest release" }
            # The server still holds its log open, so it is read with sharing allowed.
            $stream = [System.IO.File]::Open((Join-Path $tmp 'serve.log'), 'Open', 'Read', 'ReadWrite')
            try { $served = (New-Object System.IO.StreamReader $stream).ReadToEnd() } finally { $stream.Close() }
            if (-not $served.Contains("GET /latest/$v ")) { Write-Host $served; throw 'install.ps1 did not ask for the redirect' }
            if ($served.Contains('GET /api-known/releases/latest')) { throw 'install.ps1 asked the API for the latest release' }

            # The redirect names no stable release, so the list is read: it puts rc.3 first, rc.10 after
            # rc.9 with its key on a line of its own, and a higher one inside notes. Nothing is served
            # for rc.10, so the run then fails.
            $env:CADENCE_RELEASES_URL = "$url/none"
            $env:CADENCE_LATEST_URL = "$url/latest/"
            $env:CADENCE_API_URL = "$url/api-list/releases"
            $run = Install @('--yes', '--test-urls', '--dir', (Join-Path $tmp 'newest'))
            Said $run 'The newest pre-release is 0.6.0-rc.10.' 'install.ps1 did not take the highest candidate'
            if ($run.Out.Contains('This installer comes with')) { throw 'install.ps1 offered its own version, which the server there does not publish' }
            # The installer's own version is offered where its release files are, whatever the API says.
            $iv = [regex]::Match((Get-Content -Raw install.ps1), "(?m)^\`$InstallerVersion = '([^']+)'").Groups[1].Value
            $env:CADENCE_RELEASES_URL = "$url/known"
            $env:CADENCE_LATEST_URL = "$url/latest/9.9.9"
            $env:CADENCE_API_URL = "$url/api-known/releases"
            $run = Install @('--yes', '--test-urls', '--dir', (Join-Path $tmp 'known'))
            Said $run 'The latest stable release is 9.9.9.' 'install.ps1 did not take the release the redirect names'
            Said $run "This installer comes with Cadence $iv; --version $iv installs that one instead." 'install.ps1 did not offer its own version where it is published'
            Remove-Item Env:CADENCE_API_URL, Env:CADENCE_LATEST_URL
            $env:CADENCE_RELEASES_URL = "$url/good"

            # A binary Windows will not start: an inherited ACL denies running it, as a managed machine's policy does.
            $blocked = Join-Path $tmp 'blocked'
            New-Item -ItemType Directory -Force -Path (Join-Path $blocked 'Cadence') | Out-Null
            & icacls.exe (Join-Path $blocked 'Cadence') /deny "$($env:USERNAME):(OI)(X)"
            $lad = $env:LOCALAPPDATA
            $env:LOCALAPPDATA = $blocked
            try {
              $run = Install @('--yes', '--test-urls', '--version', $v, '--dir', (Join-Path $tmp 'blocked-dir'))
            } finally {
              $env:LOCALAPPDATA = $lad
            }
            if ($run.Code -eq 0) { Write-Host $run.Out; throw 'install.ps1 went on with a binary Windows will not start' }
            Said $run "Windows blocked $env:RELEASE_FILE from running." 'install.ps1 did not say Windows blocked the binary'
            Said $run "Installing Cadence here needs this machine's administrator, or a machine without that policy." 'install.ps1 did not say what installing needs'
            Said $run 'The log is at ' 'install.ps1 did not keep the log of a refusal'
            if ($run.Out -match 'Exception|install\.ps1:\d|At line|CategoryInfo') { Write-Host $run.Out; throw "install.ps1 showed PowerShell's own error" }
            if (Test-Path (Join-Path $tmp 'blocked-dir')) { throw 'install.ps1 installed a binary Windows will not start' }

            # Bytes Windows does not take for a program are the binary's fault and not a policy, and the
            # run stops there, naming --source rather than building without being asked.
            $token = $env:GITHUB_TOKEN
            Remove-Item Env:GITHUB_TOKEN, Env:GH_TOKEN -ErrorAction SilentlyContinue
            $env:GH_CONFIG_DIR = Join-Path $tmp 'no-gh'
            $env:CADENCE_RELEASES_URL = "$url/noexec"
            $env:CADENCE_API_URL = "$url/moved/releases"
            try {
              $run = Install @('--yes', '--test-urls', '--version', $v, '--dir', (Join-Path $tmp 'noexec-dir'))
            } finally {
              $env:GITHUB_TOKEN = $token
              Remove-Item Env:GH_CONFIG_DIR, Env:CADENCE_RELEASES_URL, Env:CADENCE_API_URL -ErrorAction SilentlyContinue
            }
            if ($run.Code -eq 0) { Write-Host $run.Out; throw 'install.ps1 installed bytes that are not a program' }
            Said $run "$env:RELEASE_FILE cannot be used here: it cannot start on this system, which does not take it for a program." 'install.ps1 did not say the binary is not a program here'
            Said $run "Nothing was installed. --source builds Cadence $v from source here instead." 'install.ps1 did not name --source'
            if ($run.Out.Contains('Building from source')) { Write-Host $run.Out; throw 'install.ps1 built from source without --source' }
            if ($run.Out -match 'Windows blocked|Exception|install\.ps1:\d|At line|CategoryInfo') { Write-Host $run.Out; throw 'install.ps1 called bytes that are not a program a refusal, or showed its own error' }
            if (Test-Path (Join-Path $tmp 'noexec-dir')) { throw 'install.ps1 installed bytes that are not a program' }

            # This system's build stopping in its bench as an illegal instruction does, with no build
            # asked for, gives way to the release's generic one, held to the same checks.
            $generic = "cadence-$v-windows-x86-64-generic.exe"
            if ($env:RELEASE_FILE -ne $generic) {
              $token = $env:GITHUB_TOKEN
              Remove-Item Env:GITHUB_TOKEN, Env:GH_TOKEN -ErrorAction SilentlyContinue
              $env:GH_CONFIG_DIR = Join-Path $tmp 'no-gh'
              $env:CADENCE_RELEASES_URL = "$url/illegal"
              $env:LOCALAPPDATA = Join-Path $tmp 'illegal-home'
              New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
              try {
                $run = Install @('--yes', '--test-urls', '--version', $v, '--dir', (Join-Path $tmp 'illegal'))
              } finally {
                $env:GITHUB_TOKEN = $token
                $env:LOCALAPPDATA = $lad
                Remove-Item Env:GH_CONFIG_DIR, Env:CADENCE_RELEASES_URL -ErrorAction SilentlyContinue
              }
              if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 exited $($run.Code) where the generic build runs" }
              Said $run "$env:RELEASE_FILE cannot be used here: it stopped in its bench with exit -1073741795 (an illegal instruction, one this processor lacks)." 'install.ps1 did not say the build stopped as an illegal instruction'
              Said $run "The release's generic build, $generic, is tried in its place." 'install.ps1 did not try the generic build'
              Said $run "== Checking $generic" 'install.ps1 did not check the generic build'
              if ($run.Out -notmatch 'BMI1 and LZCNT were read through \.NET:|BMI1 and LZCNT could not be read here, so a processor with AVX2 is taken to have them') { Write-Host $run.Out; throw 'install.ps1 did not say how it read BMI1 and LZCNT' }
              if ($run.Out.Contains('Building from source')) { Write-Host $run.Out; throw 'install.ps1 built from source where the generic build runs' }
              $installed = (Get-FileHash -Algorithm SHA256 (Join-Path $tmp 'illegal\cadence.exe')).Hash
              if ($installed -ne (Get-FileHash -Algorithm SHA256 (Join-Path $releases "illegal\$v\$generic")).Hash) { throw 'the generic build was not the one installed' }
              if (@(Get-Content (Join-Path $tmp 'illegal-home\Cadence\install-state')) -notcontains 'build=generic') { throw 'the state does not record the generic build' }

              # A build whose bench is the release's but which crashes when asked uci gives way to the
              # tier below it as well, and is not called corrupt.
              Remove-Item Env:GITHUB_TOKEN, Env:GH_TOKEN -ErrorAction SilentlyContinue
              $env:GH_CONFIG_DIR = Join-Path $tmp 'no-gh'
              $env:CADENCE_RELEASES_URL = "$url/ucicrash"
              $env:LOCALAPPDATA = Join-Path $tmp 'ucicrash-home'
              New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
              try {
                $run = Install @('--yes', '--test-urls', '--version', $v, '--dir', (Join-Path $tmp 'ucicrash'))
              } finally {
                $env:GITHUB_TOKEN = $token
                $env:LOCALAPPDATA = $lad
                Remove-Item Env:GH_CONFIG_DIR, Env:CADENCE_RELEASES_URL -ErrorAction SilentlyContinue
              }
              if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 exited $($run.Code) where the generic build runs after a crash at uci" }
              Said $run "$env:RELEASE_FILE cannot be used here: it stopped while answering uci with exit -1073741819" 'install.ps1 did not say the build stopped while answering uci'
              Said $run "The release's generic build, $generic, is tried in its place." 'install.ps1 did not try the generic build after a crash at uci'
              if ($run.Out.Contains('tampered with')) { Write-Host $run.Out; throw 'install.ps1 called a crash at uci a corrupt file' }
              $installed = (Get-FileHash -Algorithm SHA256 (Join-Path $tmp 'ucicrash\cadence.exe')).Hash
              if ($installed -ne (Get-FileHash -Algorithm SHA256 (Join-Path $releases "ucicrash\$v\$generic")).Hash) { throw 'the generic build was not the one installed after a crash at uci' }

              # Where no tier runs, the run stops with its log kept, as for a binary Windows refused.
              Remove-Item Env:GITHUB_TOKEN, Env:GH_TOKEN -ErrorAction SilentlyContinue
              $env:GH_CONFIG_DIR = Join-Path $tmp 'no-gh'
              $env:CADENCE_RELEASES_URL = "$url/noneruns"
              try {
                $run = Install @('--yes', '--test-urls', '--version', $v, '--dir', (Join-Path $tmp 'noneruns'))
              } finally {
                $env:GITHUB_TOKEN = $token
                Remove-Item Env:GH_CONFIG_DIR, Env:CADENCE_RELEASES_URL -ErrorAction SilentlyContinue
              }
              if ($run.Code -eq 0) { Write-Host $run.Out; throw 'install.ps1 installed where no tier runs' }
              Said $run 'The log is at ' 'install.ps1 did not keep the log where no tier runs'
            } else {
              Write-Host '::notice::the generic build was chosen here, so there is no other build to give way to it'
            }

            $gh = [bool](Get-Command gh -ErrorAction SilentlyContinue)
            if ($gh) {
              $env:CADENCE_RELEASES_URL = "$url/tampered"
              $run = Install @('--yes', '--test-urls', '--version', $v, '--dir', (Join-Path $tmp 'tampered'))
              Write-Host $run.Out
              if ($run.Code -eq 0) { throw 'install.ps1 installed a binary it should have refused' }
              Said $run "Its SHA-256 matches the release's SHA256SUMS." "the tampered binary's checksum was not the one listed"
              Said $run "$env:RELEASE_FILE's build attestation does not verify (" 'install.ps1 did not refuse the attestation'
              Said $run 'The file may be corrupt, or tampered with on its way here' 'install.ps1 did not say the file may be tampered with'
              if ($run.Out.Contains('Building from source')) { throw 'install.ps1 built from source in place of a tampered binary' }
              if (Test-Path (Join-Path $tmp 'tampered\cadence.exe')) { throw 'a binary was installed' }
            }
            # A build from source with the stand-in toolchain, whose build is the release binary, and the
            # stand-in gh answering as Gh says, under a profile and a home of their own.
            Remove-Item Env:CADENCE_RELEASES_URL -ErrorAction SilentlyContinue
            $fake = Join-Path $releases "good\$v\$env:RELEASE_FILE"
            function FromSource([string]$Name, [string]$Files, [string]$Gh, [string]$Api = '') {
              $kept = @{ Profile = $env:USERPROFILE; Home = $env:LOCALAPPDATA; Path = $env:Path }
              $env:USERPROFILE = Join-Path $tmp "$Name-profile"
              $env:LOCALAPPDATA = Join-Path $tmp "$Name-home"
              New-Item -ItemType Directory -Force -Path $env:USERPROFILE, $env:LOCALAPPDATA | Out-Null
              $env:Path = (Join-Path $tmp 'fake-gh-cmd') + ';' + (Join-Path $tmp 'fake-rust-cmd') + ';' + $env:Path
              $env:FAKE_GH = $Gh
              $env:FAKE_GH_ARGS = Join-Path $tmp "gh-args-$Name.txt"
              $env:FAKE_BUILT = $fake
              $env:FAKE_HOST = $env:RUST_HOST
              $env:CADENCE_RELEASES_URL = "$url/$Files"
              if ($Api) { $env:CADENCE_API_URL = $Api }
              try {
                return Install @('--yes', '--test-urls', '--source', '--version', $v, '--dir', (Join-Path $tmp $Name))
              } finally {
                $env:USERPROFILE = $kept.Profile
                $env:LOCALAPPDATA = $kept.Home
                $env:Path = $kept.Path
                Remove-Item Env:FAKE_GH, Env:FAKE_GH_ARGS, Env:FAKE_BUILT, Env:FAKE_HOST, Env:CADENCE_RELEASES_URL -ErrorAction SilentlyContinue
              }
            }
            $count = (Get-Content -Raw (Join-Path $releases "good\$v\bench.txt")).Trim()
            # Nothing reads a release's notes, so notes naming none, or another commit, build as others do.
            foreach ($notes in @('api-edited', 'moved')) {
              $run = FromSource "notes-$notes" 'good' 'setup' "$url/$notes/releases"
              if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 exited $($run.Code) where the release's notes were edited ($notes)" }
              Said $run "The tag $v names commit $env:TAG_COMMIT, the one fetched." "install.ps1 did not check the tag's commit ($notes)"
              if ($run.Out.Contains('the release names')) { Write-Host $run.Out; throw "install.ps1 read the release's notes ($notes)" }
              if ((Get-FileHash -Algorithm SHA256 (Join-Path $tmp "notes-$notes\cadence.exe")).Hash -ne (Get-FileHash -Algorithm SHA256 $fake).Hash) { throw "the stand-in build was not installed ($notes)" }
            }
            # A SOURCE naming another commit than the tag's, and a bench.txt other than the source's, are
            # never built, though --source asks; nor is a SOURCE whose attestation gh refuses.
            $wrong = FromSource 'source-wrong' 'source-wrong' 'setup'
            if ($wrong.Code -eq 0) { Write-Host $wrong.Out; throw "install.ps1 built a source that is not the commit its release's SOURCE names" }
            Said $wrong "release $v's SOURCE names commit 0000000000000000000000000000000000000000, and its tag names $env:TAG_COMMIT, so it is not built" "install.ps1 did not refuse a source that is not the commit its release's SOURCE names"
            $benchOff = FromSource 'source-bench' 'source-bench' 'setup'
            if ($benchOff.Code -eq 0) { Write-Host $benchOff.Out; throw "install.ps1 built a source whose bench.txt is not the release's" }
            Said $benchOff "release $v's bench.txt says $([int64]$count + 1) and the source at its tag says $count, so it is not built" "install.ps1 did not refuse a source whose bench.txt is not the release's"
            $verdict = FromSource 'source-verdict' 'source-right' 'verdict'
            if ($verdict.Code -eq 0) { Write-Host $verdict.Out; throw "install.ps1 built where gh refused the SOURCE's attestation" }
            Said $verdict "SOURCE's build attestation does not verify (X The attestation is signed by a workflow this check does not accept)" "install.ps1 did not refuse the SOURCE's attestation"
            Said $verdict 'The file may be corrupt, or tampered with on its way here' 'install.ps1 did not say SOURCE may be tampered with'
            foreach ($refused in @(@{ Run = $wrong; Dir = 'source-wrong' }, @{ Run = $benchOff; Dir = 'source-bench' }, @{ Run = $verdict; Dir = 'source-verdict' })) {
              if ($refused.Run.Out.Contains('== The Rust toolchain')) { Write-Host $refused.Run.Out; throw "install.ps1 reached the toolchain before checking the source ($($refused.Dir))" }
              if (Test-Path (Join-Path $tmp "$($refused.Dir)\cadence.exe")) { throw "a binary was installed from a source it refused ($($refused.Dir))" }
            }
            # A version with no release files has nothing but its tag to hold the source to, and says so.
            $run = FromSource 'unreleased' 'none' 'setup'
            if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 exited $($run.Code) building a version with no release files" }
            Said $run "Version $v publishes no SHA256SUMS (not found), so it has no release to hold its source to, and it is built at its tag." 'install.ps1 did not say the version has no release to hold its source to'

            # A bench that counts other than bench.txt says is a mismatch, which stops the run as a
            # checksum does.
            $token = $env:GITHUB_TOKEN
            Remove-Item Env:GITHUB_TOKEN, Env:GH_TOKEN -ErrorAction SilentlyContinue
            $env:GH_CONFIG_DIR = Join-Path $tmp 'no-gh'
            $env:CADENCE_RELEASES_URL = "$url/badbench"
            try {
              $run = Install @('--yes', '--test-urls', '--version', $v, '--dir', (Join-Path $tmp 'badbench'))
            } finally {
              $env:GITHUB_TOKEN = $token
              Remove-Item Env:GH_CONFIG_DIR -ErrorAction SilentlyContinue
            }
            if ($run.Code -eq 0) { Write-Host $run.Out; throw 'install.ps1 installed a binary whose bench does not match' }
            $count = (Get-Content -Raw (Join-Path $releases "good\$v\bench.txt")).Trim()
            Said $run "$($env:RELEASE_FILE): its bench counts $count nodes and bench.txt says" 'install.ps1 did not say the bench does not match'
            Said $run 'The file may be corrupt, or tampered with on its way here' 'install.ps1 did not say a bad bench may be tampering'
            if ($run.Out.Contains('Building from source')) { Write-Host $run.Out; throw 'install.ps1 built from source after a bench mismatch' }
            if (Test-Path (Join-Path $tmp 'badbench')) { throw 'a binary was installed after a bench mismatch' }

            # A genuine binary served as another version: its attestation names the tag it was built at.
            if ($gh) {
              $env:CADENCE_RELEASES_URL = "$url/renamed"
              $run = Install @('--yes', '--test-urls', '--version', '0.0.1', '--dir', (Join-Path $tmp 'renamed'))
              if ($run.Code -eq 0) { Write-Host $run.Out; throw 'install.ps1 installed a binary attested for another version' }
              Said $run "$env:RENAMED_FILE's build attestation does not verify (" 'install.ps1 did not refuse an attestation made at another tag'
            }

            # gh failing to check, which the install goes on past: at its setup, and with a trust root
            # that never loaded, whose failed verification is not a verdict. What gh was asked is read
            # from its arguments: the release workflow at this version's tag, exactly.
            $env:CADENCE_RELEASES_URL = "$url/good"
            $env:FAKE_GH_ARGS = Join-Path $tmp 'gh-args.txt'
            $path = $env:Path
            $env:Path = (Join-Path $tmp 'fake-gh-cmd') + ';' + $env:Path
            try {
              $env:FAKE_GH = 'setup'
              $run = Install @('--yes', '--test-urls', '--version', $v, '--dir', (Join-Path $tmp 'unchecked-setup'))
              $env:FAKE_GH = 'trust-root'
              $root = Install @('--yes', '--test-urls', '--version', $v, '--dir', (Join-Path $tmp 'unchecked-trust-root'))
              $env:FAKE_GH = 'offline'
              $offline = Install @('--yes', '--test-urls', '--version', $v, '--dir', (Join-Path $tmp 'unchecked-offline'))
              $env:FAKE_GH = 'verdict'
              $verdict = Install @('--yes', '--test-urls', '--version', $v, '--dir', (Join-Path $tmp 'unknown-verdict'))
            } finally {
              $env:Path = $path
              Remove-Item Env:FAKE_GH, Env:FAKE_GH_ARGS -ErrorAction SilentlyContinue
            }
            foreach ($unchecked in @($run, $root)) {
              if ($unchecked.Code -ne 0) { Write-Host $unchecked.Out; throw "install.ps1 exited $($unchecked.Code) when gh could not check" }
              Said $unchecked 'Its build attestation was not verified, so its SHA-256 and its bench are the checks it passed.' 'install.ps1 did not repeat at the end that the attestation was not verified'
            }
            Said $run 'Its build attestation was not verified: gh could not check it (error creating Sigstore verifier: no valid Sigstore verifiers could be initialized).' 'install.ps1 did not say gh could not check at its setup'
            Said $root 'Its build attestation was not verified: gh could not check it (Error: failed to choose verifier: public good verifier is not available (initialization may have failed)).' 'install.ps1 took a trust root that never loaded for a failed attestation'
            # Any other failure is a verdict, so it stops the run: one in words this script has never seen,
            # and one where gh did not reach GitHub.
            foreach ($unverified in @(@{ Run = $verdict; Dir = 'unknown-verdict' }, @{ Run = $offline; Dir = 'unchecked-offline' })) {
              $u = $unverified.Run
              if ($u.Code -eq 0) { Write-Host $u.Out; throw "install.ps1 installed a binary whose attestation gh did not verify ($($unverified.Dir))" }
              Said $u "$env:RELEASE_FILE's build attestation does not verify (" "install.ps1 did not refuse an attestation gh did not verify ($($unverified.Dir))"
              Said $u 'The file may be corrupt, or tampered with on its way here' 'install.ps1 did not say the file may be tampered with'
              if ($u.Out.Contains('Building from source')) { throw 'install.ps1 built from source in place of an unverified binary' }
              if (Test-Path (Join-Path $tmp "$($unverified.Dir)\cadence.exe")) { throw "install.ps1 installed a binary whose attestation gh did not verify ($($unverified.Dir))" }
            }
            Said $verdict "$env:RELEASE_FILE's build attestation does not verify (X The attestation is signed by a workflow this check does not accept)" "install.ps1 did not name gh's own words"
            if (-not (Get-Content -Raw (Join-Path $tmp 'gh-args.txt')).Contains("--repo grounzero/cadence --cert-identity https://github.com/grounzero/cadence/.github/workflows/release.yml@refs/tags/$v")) { throw "gh was not asked for the release workflow at this version's tag" }

            # gh signed out, by a configuration folder of its own and no token.
            $token = $env:GITHUB_TOKEN
            Remove-Item Env:GITHUB_TOKEN, Env:GH_TOKEN -ErrorAction SilentlyContinue
            $env:GH_CONFIG_DIR = Join-Path $tmp 'no-gh'
            try {
              Remove-Item Env:CADENCE_API_URL
              $env:CADENCE_RELEASES_URL = "$url/good"
              $run = Install @('--yes', '--test-urls', '--version', $v, '--dir', (Join-Path $tmp 'signed-out'))
              if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 exited $($run.Code) with gh signed out" }
              if ($gh) { Said $run 'Its build attestation was not verified: gh is installed but not signed in (gh auth login).' 'install.ps1 did not say the attestation was not verified' }
              Said $run 'Its build attestation was not verified, so its SHA-256 and its bench are the checks it passed.' 'install.ps1 did not repeat at the end that the attestation was not verified'

              $env:CADENCE_API_URL = "$url/moved/releases"
              $env:CADENCE_RELEASES_URL = "$url/hang"
              $env:HANG_CHILD = Join-Path $tmp 'hang-child.txt'
              $clock = [System.Diagnostics.Stopwatch]::StartNew()
              $run = Install @('--yes', '--test-urls', '--version', $v, '--dir', (Join-Path $tmp 'hang'))
              Write-Host "the run took $([int]$clock.Elapsed.TotalSeconds) s"
              if ($run.Code -eq 0) { Write-Host $run.Out; throw 'install.ps1 installed a binary that never answers' }
              Said $run "$env:RELEASE_FILE cannot be used here: it did not answer uci within 30 seconds, so it was stopped." 'install.ps1 did not stop the binary at its deadline'
              if ($run.Out.Contains('Building from source')) { Write-Host $run.Out; throw 'install.ps1 built from source after a binary hung' }
              $child = [int](Get-Content -Raw $env:HANG_CHILD).Trim()
              if (Get-Process -Id $child -ErrorAction SilentlyContinue) { Stop-Process -Id $child -Force; throw "the hanging binary's child $child outlived it" }
            } finally {
              $env:GITHUB_TOKEN = $token
              Remove-Item Env:GH_CONFIG_DIR, Env:HANG_CHILD -ErrorAction SilentlyContinue
            }

            Remove-Item Env:CADENCE_API_URL
            $env:CADENCE_RELEASES_URL = "$url/good"
            $env:CADENCE_TABLES_URL = "$url/badtables"
            $run = Install @('--yes', '--test-urls', '--tables', '--version', $v, '--dir', (Join-Path $tmp 'bad-tables'))
            if ($run.Code -eq 0) { Write-Host $run.Out; throw 'install.ps1 took a table list naming a path outside its folder' }
            Said $run "the published checksums name '../K.rtbw', which is not a table's file name, so nothing was downloaded" 'install.ps1 did not refuse the table name'
            Remove-Item Env:CADENCE_TABLES_URL

            # A release whose SOURCE names the tag's commit, held to its SHA256SUMS and to its attestation
            # where gh can check one, builds with GitHub's API refusing, which a build from source never
            # asks; the checks come before the toolchain, and the end claims no SHA-256 for a build.
            $run = FromSource 'source-right' 'source-right' 'setup' "$url/forbidden/releases"
            if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 exited $($run.Code) on a release whose SOURCE names the tag's commit" }
            Said $run "The source's bench.txt says $count, as the release's does." "install.ps1 did not hold the source's bench.txt to the release's"
            Said $run "Release $v's SOURCE matches its SHA256SUMS." 'install.ps1 did not hold SOURCE to SHA256SUMS'
            Said $run 'Its build attestation was not verified: gh could not check it (' 'install.ps1 did not ask gh about SOURCE'
            if (-not (Get-Content -Raw (Join-Path $tmp 'gh-args-source-right.txt')).Contains("SOURCE --repo grounzero/cadence --cert-identity https://github.com/grounzero/cadence/.github/workflows/release.yml@refs/tags/$v")) { throw "gh was not asked about SOURCE for the release workflow at this version's tag" }
            Said $run "Release $v's SOURCE names commit $env:TAG_COMMIT, the one fetched." 'install.ps1 did not check the commit SOURCE names'
            if ($run.Out.Contains("GitHub's API did not answer")) { throw "install.ps1 asked GitHub's API to build from source" }
            Said $run "It was built here from source at the tag $v, so its bench is the check it passed." 'install.ps1 did not say how the build was checked'
            if ($run.Out.Contains('its SHA-256 and its bench are the checks it passed')) { throw 'install.ps1 claimed a SHA-256 for a build' }
            $named = $run.Out.IndexOf('SOURCE names commit')
            $tools = $run.Out.IndexOf('== The Rust toolchain')
            if ($named -lt 0 -or $tools -lt 0 -or $named -gt $tools) { throw 'install.ps1 did not check the source before the toolchain' }
            $built = Get-FileHash -Algorithm SHA256 (Join-Path $tmp 'source-right\cadence.exe')
            if ($built.Hash -ne (Get-FileHash -Algorithm SHA256 $fake).Hash) { throw 'the stand-in build was not installed' }
            # The stand-in rustup holds no toolchain, so the one this run installed is recorded for the
            # uninstall to name.
            $channel = [regex]::Match((git show "${v}:rust-toolchain.toml" | Out-String), '(?m)^channel\s*=\s*"([^"]+)"').Groups[1].Value
            if (-not $channel) { throw "the tag $v pins no channel in rust-toolchain.toml" }
            $recorded = @(Get-Content (Join-Path $tmp 'source-right-home\Cadence\install-state'))
            if (-not ($recorded -like "installed_toolchain=Rust $channel, which 'rustup toolchain uninstall $channel' removes")) { Write-Host ($recorded -join "`n"); throw 'the toolchain the build installed was not recorded' }
            # The source route's git calls are tried a second time where the first fails, as a download is.
            $marks = Join-Path $tmp 'flaky-git-marks'
            New-Item -ItemType Directory -Force -Path $marks | Out-Null
            $env:CADENCE_API_URL = "$url/forbidden/releases"
            $env:FAKE_BUILT = $fake
            $env:FAKE_HOST = $env:RUST_HOST
            $env:FAKE_GIT_MARKS = $marks
            $env:FAKE_GIT_REAL = (Get-Command git.exe).Source
            $savedProfile = $env:USERPROFILE
            $path = $env:Path
            $env:USERPROFILE = Join-Path $tmp 'flaky-git-profile'
            New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
            $env:LOCALAPPDATA = Join-Path $tmp 'flaky-git-home'
            New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
            $env:Path = (Join-Path $tmp 'flaky-git-cmd') + ';' + (Join-Path $tmp 'fake-rust-cmd') + ';' + $env:Path
            try {
              $run = Install @('--yes', '--test-urls', '--source', '--version', $v, '--dir', (Join-Path $tmp 'flaky-git'))
            } finally {
              $env:USERPROFILE = $savedProfile
              $env:LOCALAPPDATA = $lad
              $env:Path = $path
              Remove-Item Env:FAKE_BUILT, Env:FAKE_HOST, Env:FAKE_GIT_MARKS, Env:FAKE_GIT_REAL -ErrorAction SilentlyContinue
            }
            if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 exited $($run.Code) where git failed once for the network" }
            Said $run 'Listing the releases at https://github.com/grounzero/cadence.git failed, so it is tried once more in 3 seconds.' 'install.ps1 did not try git ls-remote again'
            Said $run "Fetching Cadence $v failed, so it is tried once more in 3 seconds." 'install.ps1 did not try git fetch again'
            if (-not ((Test-Path (Join-Path $marks 'ls-remote')) -and (Test-Path (Join-Path $marks 'fetch')))) { throw 'the flaky git was not the one called' }
            if ((Get-FileHash -Algorithm SHA256 (Join-Path $tmp 'flaky-git\cadence.exe')).Hash -ne (Get-FileHash -Algorithm SHA256 $fake).Hash) { throw 'the stand-in build was not installed' }
            # A toolchain install that fails installed nothing, so nothing is recorded for the uninstall to
            # name, though the build goes on.
            $env:CADENCE_API_URL = "$url/forbidden/releases"
            $env:FAKE_BUILT = $fake
            $env:FAKE_HOST = $env:RUST_HOST
            $env:FAKE_RUSTUP_FAIL = '1'
            $savedProfile = $env:USERPROFILE
            $path = $env:Path
            $env:USERPROFILE = Join-Path $tmp 'no-toolchain-profile'
            New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
            $env:LOCALAPPDATA = Join-Path $tmp 'no-toolchain-home'
            New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
            $env:Path = (Join-Path $tmp 'fake-rust-cmd') + ';' + $env:Path
            try {
              $run = Install @('--yes', '--test-urls', '--source', '--version', $v, '--dir', (Join-Path $tmp 'no-toolchain'))
            } finally {
              $env:USERPROFILE = $savedProfile
              $env:LOCALAPPDATA = $lad
              $env:Path = $path
              Remove-Item Env:FAKE_BUILT, Env:FAKE_HOST, Env:FAKE_RUSTUP_FAIL -ErrorAction SilentlyContinue
            }
            if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 exited $($run.Code) where only the toolchain install failed" }
            Said $run 'This rustup installs the Rust version Cadence pins as the build starts instead.' 'the stand-in toolchain install did not fail'
            $recorded = @(Get-Content (Join-Path $tmp 'no-toolchain-home\Cadence\install-state'))
            if ($recorded -like 'installed_toolchain=*') { Write-Host ($recorded -join "`n"); throw 'install.ps1 recorded a toolchain whose install failed' }
            # Finding the release: a refusal is the rate limit only where GitHub's answer says it is.
            $found = @{}
            $env:CADENCE_LATEST_URL = "$url/latest/"
            foreach ($api in @('forbidden', 'limited')) {
              $env:CADENCE_API_URL = "$url/$api/releases"
              $found[$api] = Install @('--yes', '--test-urls', '--dir', (Join-Path $tmp "find-$api"))
              if ($found[$api].Code -eq 0) { Write-Host $found[$api].Out; throw 'install.ps1 found a release through an API that refuses' }
            }
            Remove-Item Env:CADENCE_API_URL, Env:CADENCE_LATEST_URL
            Said $found['forbidden'] "could not read Cadence's releases from GitHub (the server answered 403)" 'install.ps1 did not say the API refused'
            if ($found['forbidden'].Out.Contains('limits how often')) { throw "install.ps1 called a 403 GitHub's rate limit without GitHub saying so" }
            Said $found['limited'] "GitHub refused to name Cadence's releases (the server answered 403): it limits how often one address asks." "install.ps1 did not name GitHub's rate limit where GitHub said so"

            # A download that fails for the network is tried once more: each file's first answer of 503
            # is followed by the file, and a server that never answers stops the run after two tries.
            $token = $env:GITHUB_TOKEN
            Remove-Item Env:GITHUB_TOKEN, Env:GH_TOKEN -ErrorAction SilentlyContinue
            $env:GH_CONFIG_DIR = Join-Path $tmp 'no-gh'
            $env:CADENCE_RELEASES_URL = "$url/flaky"
            $env:LOCALAPPDATA = Join-Path $tmp 'flaky-home'
            New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
            try {
              $run = Install @('--yes', '--test-urls', '--version', $v, '--dir', (Join-Path $tmp 'flaky'))
            } finally {
              $env:GITHUB_TOKEN = $token
              $env:LOCALAPPDATA = $lad
              Remove-Item Env:GH_CONFIG_DIR -ErrorAction SilentlyContinue
            }
            if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 exited $($run.Code) where each file came at the second try" }
            # The server still holds its log open, so it is read with sharing allowed.
            $stream = [System.IO.File]::Open((Join-Path $tmp 'serve.log'), 'Open', 'Read', 'ReadWrite')
            try { $served = (New-Object System.IO.StreamReader $stream).ReadToEnd() } finally { $stream.Close() }
            foreach ($f in @('SHA256SUMS', $env:RELEASE_FILE, 'bench.txt')) {
              $n = ([regex]::Matches($served, [regex]::Escape("GET /flaky/$v/$f "))).Count
              if ($n -ne 2) { Write-Host $served; throw "$f was asked for $n times, not twice" }
            }
            $env:CADENCE_RELEASES_URL = 'http://127.0.0.1:9'
            $run = Install @('--yes', '--test-urls', '--version', $v, '--dir', (Join-Path $tmp 'offline'))
            if ($run.Code -eq 0) { Write-Host $run.Out; throw 'install.ps1 went on without a server' }
            Said $run "could not download release $v's SHA256SUMS (no connection to the server), after trying twice. Check the network connection" 'install.ps1 did not say the download failed twice for the network'
            if ($run.Out.Contains('Building from source')) { Write-Host $run.Out; throw 'install.ps1 built from source when offline' }

            # Every release has a binary for this system, so a SHA256SUMS without a SHA-256 for it, whether
            # the entry is missing, is not a SHA-256 or the file is a web page, is damaged: the run stops,
            # and nothing is built from source in its place.
            $env:CADENCE_API_URL = "$url/moved/releases"
            foreach ($kind in @('nobinary', 'malformed', 'websums')) {
              $env:CADENCE_RELEASES_URL = "$url/$kind"
              $run = Install @('--yes', '--test-urls', '--version', $v, '--dir', (Join-Path $tmp $kind))
              if ($run.Code -eq 0) { Write-Host $run.Out; throw "install.ps1 installed through a damaged SHA256SUMS ($kind)" }
              Said $run "Release $v's SHA256SUMS gives no SHA-256 for cadence-$v-" "install.ps1 did not say the SHA256SUMS lacks the binary's SHA-256 ($kind)"
              Said $run "which every release of $v has, so the file is damaged" "install.ps1 did not call the SHA256SUMS damaged ($kind)"
              Said $run 'The file may be corrupt, or tampered with on its way here' "install.ps1 did not say the file may be tampered with ($kind)"
              if ($run.Out.Contains('Building from source')) { Write-Host $run.Out; throw "install.ps1 built from source for a damaged SHA256SUMS ($kind)" }
            }
            Remove-Item Env:CADENCE_API_URL

            # An uninstall leaves nothing the install made behind: the folders it created for the binary,
            # its record and its logs, and the logs of earlier runs.
            foreach ($dir in @('', (Join-Path $tmp 'made-for-it\deep\bin'))) {
              $env:LOCALAPPDATA = Join-Path $tmp 'leftover-home'
              New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
              $env:CADENCE_RELEASES_URL = "$url/good"
              try {
                $asked = @('--yes', '--test-urls', '--version', $v)
                if ($dir) { $asked += @('--dir', $dir) }
                $run = Install $asked
                if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 exited $($run.Code) installing into a fresh folder ($dir)" }
                Set-Content -Path (Join-Path $env:LOCALAPPDATA 'Cadence\install-20000101-000000.log') -Value 'an earlier run'
                Remove-Item Env:CADENCE_RELEASES_URL
                $run = Install @('--yes', '--uninstall')
                if ($run.Code -ne 0) { Write-Host $run.Out; throw "the uninstall exited $($run.Code) ($dir)" }
                if (Test-Path (Join-Path $env:LOCALAPPDATA 'Cadence')) { Write-Host $run.Out; Get-ChildItem -Recurse -Force (Join-Path $env:LOCALAPPDATA 'Cadence') | Out-Host; throw "the uninstall left the Cadence folder behind ($dir)" }
              } finally {
                $env:LOCALAPPDATA = $lad
                Remove-Item Env:CADENCE_RELEASES_URL -ErrorAction SilentlyContinue
              }
            }
            if (Test-Path (Join-Path $tmp 'made-for-it')) { throw 'the uninstall left the folders it made for --dir' }

            # Without an install record, a file at the default path may not be this installer's, so --yes
            # alone does not remove it, and the uninstall says why.
            $env:LOCALAPPDATA = Join-Path $tmp 'no-record-home'
            New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALAPPDATA 'Cadence') | Out-Null
            Set-Content -Path (Join-Path $env:LOCALAPPDATA 'Cadence\cadence.exe') -Value 'built by hand'
            try {
              $run = Install @('--yes', '--uninstall')
            } finally {
              $env:LOCALAPPDATA = $lad
            }
            if ($run.Code -ne 0) { Write-Host $run.Out; throw "the uninstall exited $($run.Code) with no record" }
            if (-not (Test-Path (Join-Path $tmp 'no-record-home\Cadence\cadence.exe'))) { Write-Host $run.Out; throw 'the uninstall removed a file it has no record of, under --yes' }
            Said $run 'There is no install record, so ' 'the uninstall did not say why it keeps the file'
            if ((Get-Content -Raw install.ps1).Contains('one build')) { throw 'install.ps1 still says Cadence has one build' }
            Write-Host 'every refusal held'
          } finally {
            Remove-Item Env:CADENCE_RELEASES_URL, Env:CADENCE_LATEST_URL, Env:CADENCE_API_URL, Env:CADENCE_TABLES_URL -ErrorAction SilentlyContinue
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
          # The step's shell exits with the last native exit code, which a refused install left at 1.
          exit 0

      # A home of its own for each run, so the comparison reads only what these runs installed: an
      # older release, then the upgrade with tables, a second run that must change nothing, both
      # downgrades declined, another build and a build from source asked for, a file the script did
      # not install, and the uninstall. Then the installs the published installers recorded by path
      # alone, the same version and an older one.
      - name: install.sh compares versions, and a second run changes nothing
        if: env.SCRIPT == 'install.sh'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp=$RUNNER_TEMP
          py=python3
          if [ "$RUNNER_OS" = Windows ]; then tmp=$(cygpath -u "$RUNNER_TEMP"); py=python; fi
          (cd "$tmp/releases" && exec $py "$tmp/serve.py" 8713) > "$tmp/serve-2.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2> /dev/null || true' EXIT
          url=http://127.0.0.1:8713
          for i in $(seq 30); do curl -fs -o /dev/null "$url/tables/sha256" && break; sleep 1; done
          v=$RELEASE_VERSION
          bad() { echo "::error::$*"; exit 1; }
          said() { grep -qF -- "$2" "$1" || { cat "$1"; bad "$3"; }; }
          # The published release just below this one, from GitHub's list.
          old=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/grounzero/cadence/releases?per_page=100" \
            | $py -c 'import json, sys; print("\n".join(r["tag_name"] for r in json.load(sys.stdin) if not r["draft"]))' \
            | tr -d '\r' | grep -Ex '[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?' \
            | awk -F '[.-]' '{rc = ($4 == "rc"); print $1, $2, $3, (rc ? 0 : 1), (rc ? $5 : 0), $0}' \
            | sort -k1,1n -k2,2n -k3,3n -k4,4n -k5,5n | awk -v v="$v" '$6 == v {exit} {o = $6} END {print o}')
          [ -n "$old" ] || bad "GitHub lists no published release older than $v"
          echo "older: $old; this: $v"

          if [ "$RUNNER_OS" = Windows ]; then
            export LOCALAPPDATA=$(cygpath -w "$tmp/home-lad")
            app=$tmp/home-lad/Cadence
            bin=$app/cadence.exe state=$app/install-state tables=$app/syzygy/3-4-5
          else
            export HOME=$tmp/home
            bin=$HOME/.local/bin/cadence state=$HOME/.local/share/cadence/install-state
            tables=$HOME/.local/share/cadence/syzygy/3-4-5
          fi
          mkdir -p "$tmp/home" "$tmp/home-lad"
          snapshot() {
            $py - "$bin" "$state" "$tables" "$HOME/.bashrc" "$HOME/.bash_profile" "$HOME/.zshrc" "$HOME/.profile" <<'EOF'
          import hashlib, os, sys
          for root in sys.argv[1:]:
              files = [root] if os.path.isfile(root) else sorted(
                  os.path.join(d, f) for d, _, fs in os.walk(root) for f in fs)
              if not files:
                  print("absent", root)
              for path in files:
                  st = os.stat(path)
                  print(path, st.st_size, st.st_mtime_ns, hashlib.sha256(open(path, "rb").read()).hexdigest())
          EOF
            [ "$RUNNER_OS" != Windows ] || powershell.exe -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path', 'User')"
          }
          # The user's own PATH line, written by hand, which the uninstall must leave; on Windows a user
          # PATH holding a %VARIABLE%, which every edit must leave unexpanded in a REG_EXPAND_SZ.
          if [ "$RUNNER_OS" = Windows ]; then
            powershell.exe -NoProfile -Command "\$k = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Environment'); \$p = [string]\$k.GetValue('Path', '', 'DoNotExpandEnvironmentNames'); \$k.SetValue('Path', (\$p.TrimEnd(';') + ';%USERPROFILE%\\cadence-unexpanded').TrimStart(';'), 'ExpandString')"
          else
            export SHELL=/bin/bash
            own="export PATH=\"$HOME/.local/bin:\$PATH\""
            profile=$HOME/.bashrc
            [ "$RUNNER_OS" != macOS ] || profile=$HOME/.bash_profile
            printf '%s\n' "$own" > "$profile"
          fi
          unexpanded() {
            [ "$RUNNER_OS" = Windows ] || return 0
            kept=$(powershell.exe -NoProfile -Command "\$k = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment'); '{0} {1}' -f \$k.GetValueKind('Path'), \$k.GetValue('Path', '', 'DoNotExpandEnvironmentNames')" | tr -d '\r')
            case "$kept" in
              "ExpandString "*'%USERPROFILE%\cadence-unexpanded'*) ;;
              *) bad "$1 left the user PATH as $kept" ;;
            esac
          }
          marks() {
            if [ "$RUNNER_OS" = Windows ]; then
              powershell.exe -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path', 'User')" | tr -d '\r' | tr ';' '\n' \
                | grep -cixF "$(cygpath -w "$tmp/home-lad/Cadence")" || true
            else
              cat "$HOME"/.bashrc "$HOME"/.bash_profile "$HOME"/.zshrc "$HOME"/.profile 2> /dev/null \
                | grep -cxF '# Added by the Cadence installer' || true
            fi
          }

          bash install.sh --yes --version "$old" > old.txt 2>&1 || { cat old.txt; bad "install.sh could not install $old"; }
          said old.txt "Installed " "install.sh did not install $old"
          [ "$(marks)" = 1 ] || bad "the first install did not add one PATH entry"
          unexpanded "the first install"

          rc=0
          CADENCE_TABLES_URL="$url/tables" bash install.sh --yes --test-urls --tables --version "$v" > up.txt 2>&1 || rc=$?
          [ "$rc" -eq 0 ] || { cat up.txt; bad "install.sh exited $rc on the upgrade"; }
          said up.txt "Cadence $old is installed at" "install.sh did not name the installed version"
          said up.txt ", and $v is available." "install.sh did not name the version available"
          said up.txt "Upgrade it to $v? [Y/n]: y (--yes)" "the upgrade did not default to yes"
          said up.txt "290 downloaded now, 0 already there." "the tables were not downloaded"
          [ "$(marks)" = 1 ] || bad "the upgrade added the PATH entry again"
          id=$(printf 'uci\nquit\n' | "$bin" | tr -d '\r' | sed -n 's/^id name //p')
          [ "$id" = "Cadence $v" ] || bad "after the upgrade the binary calls itself $id"

          snapshot > before.txt
          rc=0
          CADENCE_TABLES_URL="$url/tables" bash install.sh --yes --test-urls --tables --version "$v" > again.txt 2>&1 || rc=$?
          snapshot > after.txt
          [ "$rc" -eq 0 ] || { cat again.txt; bad "install.sh exited $rc on the second run"; }
          said again.txt "Cadence $v is already installed at" "the second run did not find the version installed"
          said again.txt ", so it is up to date." "the second run did not say it is up to date"
          said again.txt "0 downloaded now, 290 already there." "the second run downloaded tables again"
          diff before.txt after.txt || bad "the second run changed what the first installed"
          [ "$(marks)" = 1 ] || bad "the second run added the PATH entry again"

          # An older release found without --version is a downgrade, declined by default; one named by
          # --version under --yes is taken, and the upgrade then restores this one. A stable one is found
          # through the redirect naming it, and a candidate in the list where the redirect names none.
          mkdir -p "$tmp/releases/api-old/releases"
          case "$old" in
            *-rc.*)
              printf '[{"tag_name": "%s"}]\n' "$old" > "$tmp/releases/api-old/releases/index.html"
              latest="$url/latest/"
              ;;
            *)
              printf '{"tag_name": "%s"}\n' "$old" > "$tmp/releases/api-old/releases/latest"
              latest="$url/latest/$old"
              ;;
          esac
          for mode in "" --update; do
            rc=0
            CADENCE_LATEST_URL="$latest" CADENCE_API_URL="$url/api-old/releases" bash install.sh --yes --test-urls $mode \
              > down.txt 2>&1 || rc=$?
            [ "$rc" -ne 0 ] || { cat down.txt; bad "install.sh ${mode:-without --update} downgraded by default"; }
            said down.txt "It is newer than $old, so installing $old would be a downgrade." "the downgrade was not named"
            said down.txt "Downgrade it to $old? [y/N]: n (--yes)" "the downgrade did not default to no"
            snapshot > down-after.txt
            diff after.txt down-after.txt || bad "a declined downgrade changed the install"
          done
          rc=0
          bash install.sh --yes --version "$old" > down.txt 2>&1 || rc=$?
          [ "$rc" -eq 0 ] || { cat down.txt; bad "install.sh --yes --version $old exited $rc"; }
          said down.txt "Downgrading it to $old, as --yes and --version $old ask." "install.sh --yes --version $old did not downgrade"
          id=$(printf 'uci\nquit\n' | "$bin" | tr -d '\r' | sed -n 's/^id name //p')
          [ "$id" = "Cadence $old" ] || bad "after the downgrade the binary calls itself $id"
          bash install.sh --yes --version "$v" > back.txt 2>&1 || { cat back.txt; bad "install.sh could not upgrade back to $v"; }
          said back.txt "Upgrade it to $v? [Y/n]: y (--yes)" "the upgrade back to $v was not offered"

          # A build from source asked for at the same version replaces the release binary installed, and
          # a SOURCE naming another commit then stops it before anything is built. Where the release has a
          # generic binary beside the AVX2 or AVX-512 one, asking for it replaces that one, and --build
          # avx512 is refused on a processor without AVX-512.
          rc=0
          PATH="$tmp/fake-gh:$PATH" FAKE_GH=setup FAKE_GH_ARGS="$tmp/gh-args-2" CADENCE_RELEASES_URL="$url/source-wrong" \
            bash install.sh --yes --test-urls --source --version "$v" > source.txt 2>&1 || rc=$?
          [ "$rc" -ne 0 ] || { cat source.txt; bad "install.sh built a source that is not the commit its release's SOURCE names"; }
          said source.txt "and --source asks for it built from source, so it is replaced." "install.sh took --source at the same version as up to date"
          said source.txt "SOURCE names commit 0000000000000000000000000000000000000000, and its tag names" "the SOURCE naming another commit did not stop the build"
          case "$ASSET" in
            *-avx2)
              if grep -qE 'the (AVX2|AVX-512) build runs here' up.txt; then
                was=$(sed -n 's/^build=//p' "$state")
                rc=0
                bash install.sh --yes --generic --version "$v" > generic.txt 2>&1 || rc=$?
                [ "$rc" -eq 0 ] || { cat generic.txt; bad "install.sh exited $rc installing the generic build over the $was one"; }
                said generic.txt " in the $was build, and the generic build is asked for, so it is replaced." \
                  "install.sh did not replace the $was build with the generic one"
                grep -qx 'build=generic' "$state" || { cat "$state"; bad "the state does not record the generic build"; }
                bash install.sh --yes --version "$v" > plain-after.txt 2>&1 || { cat plain-after.txt; bad "a plain run over the generic build failed"; }
                said plain-after.txt ", so it is up to date." "a plain run did not take the generic build as up to date"
              fi
              if ! grep -qF 'the AVX-512 build runs here' up.txt; then
                rc=0
                bash install.sh --yes --build avx512 --version "$v" > avx512.txt 2>&1 || rc=$?
                [ "$rc" -ne 0 ] || { cat avx512.txt; bad "install.sh took --build avx512 on a processor without AVX-512"; }
                said avx512.txt "--build avx512 needs AVX-512F, AVX-512BW, AVX2, BMI1, LZCNT and POPCNT, and this processor lacks" \
                  "install.sh did not say why it refused --build avx512"
              fi
              ;;
          esac

          # A file the script has no record of, which leaves a mark if it is run.
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$tmp/marker.exe" "$bin"
          else
            printf '#!/bin/sh\ntouch "%s"\n' "$tmp/ran.txt" > "$bin"
            chmod 755 "$bin"
          fi
          rc=0
          bash install.sh --yes --update --version "$v" > unknown.txt 2>&1 || rc=$?
          [ "$rc" -eq 0 ] || { cat unknown.txt; bad "install.sh exited $rc replacing a file it did not install"; }
          said unknown.txt "whose version this script has no record of." "install.sh did not say the file there is unknown to it"
          said unknown.txt "Replace it? [Y/n]: y (--yes)" "the replacement under --update did not default to yes"
          [ ! -e "$tmp/ran.txt" ] || bad "install.sh ran the file at the install path"

          # What the installs recorded installing to build, named by the uninstall and left alone.
          printf "installed_rust=rustup and every Rust toolchain it holds, which 'rustup self uninstall' removes\n" >> "$state"
          rc=0
          bash install.sh --yes --uninstall > uninstall.txt 2>&1 || rc=$?
          [ "$rc" -eq 0 ] || { cat uninstall.txt; bad "the uninstall exited $rc"; }
          said uninstall.txt "To build Cadence, this installer also installed rustup and every Rust toolchain it holds, which 'rustup self uninstall' removes." \
            "the uninstall did not name the Rust it installed"
          [ ! -e "$bin" ] || bad "the uninstall left $bin"
          [ ! -e "$tables" ] || bad "the uninstall left the tables"
          [ ! -e "$state" ] || bad "the uninstall left the install state"
          [ "$(marks)" = 0 ] || bad "the uninstall left the PATH entry"
          if [ "$RUNNER_OS" = Windows ]; then
            unexpanded "the uninstall"
          else
            [ "$(grep -cxF "$own" "$profile")" = 1 ] || { cat "$profile"; bad "the uninstall did not leave the PATH line written by hand"; }
            # The blank line the install wrote before its marker goes with it.
            [ "$(cat "$profile")" = "$own" ] && [ "$(wc -l < "$profile" | tr -d ' ')" = 1 ] \
              || { od -c "$profile"; bad "the uninstall left more than the line written by hand"; }
          fi
          bash install.sh --yes --uninstall > uninstall-again.txt 2>&1 || { cat uninstall-again.txt; bad "a second uninstall failed"; }
          said uninstall-again.txt "There is no Cadence at" "a second uninstall did not find nothing to remove"

          # A plain run after a --dir install finds that folder in the state, and the uninstall removes
          # the binary there; no second copy goes into the default folder.
          home=$tmp/home-dir
          mkdir -p "$home"
          lad=$home
          [ "$RUNNER_OS" != Windows ] || lad=$(cygpath -w "$home")
          exe=""
          [ "$RUNNER_OS" != Windows ] || exe=.exe
          env HOME="$home" LOCALAPPDATA="$lad" CADENCE_RELEASES_URL="$url/good" bash install.sh --yes --test-urls --version "$v" \
            --dir "$tmp/chosen" > dir-1.txt 2>&1 || { cat dir-1.txt; bad "the --dir install failed"; }
          env HOME="$home" LOCALAPPDATA="$lad" CADENCE_RELEASES_URL="$url/good" bash install.sh --yes --test-urls --version "$v" \
            > dir-2.txt 2>&1 || { cat dir-2.txt; bad "the plain run after the --dir install failed"; }
          grep -F 'is already installed at' dir-2.txt | grep -qF chosen || { cat dir-2.txt; bad "the plain run did not find the --dir install"; }
          for copy in "$home/.local/bin/cadence" "$home/Cadence/cadence.exe"; do
            [ ! -e "$copy" ] || bad "the plain run installed a second copy at $copy"
          done
          env HOME="$home" LOCALAPPDATA="$lad" bash install.sh --yes --uninstall > dir-3.txt 2>&1 || { cat dir-3.txt; bad "the uninstall failed"; }
          [ ! -e "$tmp/chosen/cadence$exe" ] || bad "the uninstall left the binary in the --dir folder"

          # A run into another folder offers to remove the copy the state records and its PATH entry, yes
          # by default, so the uninstall after it leaves nothing behind.
          home=$tmp/home-moved
          mkdir -p "$home"
          lad=$home
          [ "$RUNNER_OS" != Windows ] || lad=$(cygpath -w "$home")
          first=$home/.local/bin/cadence
          [ "$RUNNER_OS" != Windows ] || first=$home/Cadence/cadence.exe
          moved() {
            env HOME="$home" LOCALAPPDATA="$lad" SHELL=/bin/bash CADENCE_RELEASES_URL="$url/good" bash install.sh --yes --test-urls "$@"
          }
          moved --version "$v" > moved-1.txt 2>&1 || { cat moved-1.txt; bad "the first install failed"; }
          [ -f "$first" ] || bad "the first install put nothing at $first"
          moved --version "$v" --dir "$home/elsewhere" > moved-2.txt 2>&1 || { cat moved-2.txt; bad "the install into another folder failed"; }
          said moved-2.txt "An earlier run installed Cadence at" "the run into another folder did not name the earlier copy"
          said moved-2.txt "Remove that copy, and the PATH entry this script added for it? [Y/n]: y (--yes)" \
            "the earlier copy's removal was not offered with yes as the default"
          [ ! -e "$first" ] || bad "the earlier copy was left at $first"
          if [ "$RUNNER_OS" = Windows ]; then
            left=$(powershell.exe -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path', 'User')" | tr -d '\r' | tr ';' '\n' \
              | grep -cixF "$(cygpath -w "$home/Cadence")" || true)
            [ "$left" = 0 ] || bad "the earlier copy's PATH entry was left"
          elif { cat "$home/.bashrc" "$home/.bash_profile" 2> /dev/null || true; } | grep -qxF '# Added by the Cadence installer'; then
            bad "the earlier copy's PATH line was left"
          fi
          moved --uninstall > moved-3.txt 2>&1 || { cat moved-3.txt; bad "the uninstall after the move failed"; }
          for copy in "$first" "$home/elsewhere/cadence$exe"; do [ ! -e "$copy" ] || bad "the uninstall left $copy"; done
          # With everything gone, so are the record and the folders this script made, and its profile lines.
          for dir in "$home/.cache/cadence" "$home/.local/share/cadence" "$home/Cadence"; do
            [ ! -e "$dir" ] || { ls -la "$dir"; bad "the uninstall left the folder $dir"; }
          done
          said moved-3.txt "Removed the empty folder" "the uninstall did not say it removed its folders"
          for rc_file in "$home/.bashrc" "$home/.bash_profile"; do
            [ ! -s "$rc_file" ] || { od -c "$rc_file"; bad "the uninstall left lines in $rc_file"; }
          done

          # What the user keeps is kept in the record, which the uninstall keeps for it; answered at the
          # terminal util-linux's script gives it.
          if [ "$RUNNER_OS" = Linux ]; then
            moved --version "$v" > kept-1.txt 2>&1 || { cat kept-1.txt; bad "the install before a kept uninstall failed"; }
            printf 'n\ny\n' | env HOME="$home" SHELL=/bin/bash script -qec "bash install.sh --uninstall" /dev/null > kept-2.txt 2>&1 || true
            [ -f "$first" ] || { cat kept-2.txt; bad "the uninstall removed the binary the user kept"; }
            st=$home/.local/share/cadence/install-state
            grep -qx "binary=$first" "$st" || { cat kept-2.txt "$st"; bad "the record of the kept binary was not kept"; }
            if grep -q '^path_' "$st"; then cat "$st"; bad "the record kept the PATH line that was removed"; fi
            said kept-2.txt "is kept for what stays: Cadence at $first." "the uninstall did not say why the record stays"
            moved --uninstall > kept-3.txt 2>&1 || { cat kept-3.txt; bad "the uninstall after a kept one failed"; }
            [ ! -e "$first" ] && [ ! -e "$st" ] || bad "the second uninstall left the binary or the record"
          fi

          # An earlier copy changed since it was installed may be the user's own, so it is kept by default.
          moved --version "$v" > changed-1.txt 2>&1 || { cat changed-1.txt; bad "the first install failed"; }
          printf 'changed by hand\n' > "$first"
          moved --version "$v" --dir "$home/elsewhere" > changed-2.txt 2>&1 || { cat changed-2.txt; bad "the install beside a changed copy failed"; }
          said changed-2.txt "It has changed since it was installed: its SHA-256 is not the one recorded." "the changed copy was not named as changed"
          said changed-2.txt "Remove that copy, and the PATH entry this script added for it? [y/N]: n (--yes)" "the changed copy's removal did not default to no"
          [ "$(cat "$first")" = 'changed by hand' ] || bad "the changed copy was removed or rewritten"

          # The folder the state records, spelled with a trailing slash or reached through a link, is that
          # folder: the install in it is found up to date and is never removed.
          home=$tmp/home-spelled
          mkdir -p "$home/real"
          lad=$home
          [ "$RUNNER_OS" != Windows ] || lad=$(cygpath -w "$home")
          spelled() {
            env HOME="$home" LOCALAPPDATA="$lad" CADENCE_RELEASES_URL="$url/good" bash install.sh --yes --test-urls --version "$v" "$@"
          }
          spelled --dir "$home/real/" > spelled-0.txt 2>&1 || { cat spelled-0.txt; bad "the install with a trailing slash failed"; }
          if [ "$RUNNER_OS" = Windows ]; then
            st=$home/Cadence/install-state
            grep -qxF "binary=$(cygpath -w "$home/real/cadence.exe")" "$st" || { cat "$st"; bad "the state did not record the folder without its trailing slash"; }
            powershell.exe -NoProfile -Command "New-Item -ItemType Junction -Path '$(cygpath -w "$home/link")' -Target '$(cygpath -w "$home/real")' | Out-Null"
          else
            st=$home/.local/share/cadence/install-state
            grep -qxF "binary=$home/real/cadence" "$st" || { cat "$st"; bad "the state did not record the folder without its trailing slash"; }
            ln -s "$home/real" "$home/link"
          fi
          spellings=("$home/real" "$home/link" "$home/link/")
          # On Windows a subst drive spells the same folder with another letter.
          if [ "$RUNNER_OS" = Windows ]; then
            drive=$(powershell.exe -NoProfile -Command "@('Q', 'R', 'S', 'T', 'U', 'V', 'W', 'X', 'Y', 'Z' | Where-Object { -not (Test-Path (\$_ + ':\\')) })[0]" | tr -d '\r')
            subst "$drive:" "$(cygpath -w "$home")"
            spellings+=("$drive:\\real")
          fi
          for dir in "${spellings[@]}"; do
            spelled --dir "$dir" > spelled.txt 2>&1 || { cat spelled.txt; bad "the run with --dir $dir failed"; }
            said spelled.txt ", so it is up to date." "--dir $dir was not taken for the folder installed in"
            if grep -qF 'An earlier run installed Cadence at' spelled.txt; then cat spelled.txt; bad "--dir $dir offered to remove the install in its own folder"; fi
            [ -f "$home/real/cadence$exe" ] || bad "--dir $dir removed the install"
          done
          [ "$RUNNER_OS" != Windows ] || MSYS_NO_PATHCONV=1 subst "$drive:" /D

          # A build recorded as baseline was made where the target has no AVX2 or generic settings, so
          # any build asked for there is that one, and nothing is rebuilt.
          sed -i.bak 's/^build=.*/build=baseline/' "$st"
          builds=(--generic "--build avx2")
          ! grep -qF 'the AVX-512 build runs here' up.txt || builds+=("--build avx512")
          for build in "${builds[@]}"; do
            spelled --dir "$home/real" $build > baseline.txt 2>&1 || { cat baseline.txt; bad "the run with $build over a baseline build failed"; }
            said baseline.txt ", so it is up to date." "$build was not taken for the baseline build installed"
          done

          # A tablebase download that stopped is offered again by a plain run, yes by default, and keeps
          # what it already has; once finished, a plain run does not offer it.
          home=$tmp/home-tables
          mkdir -p "$home"
          lad=$home
          [ "$RUNNER_OS" != Windows ] || lad=$(cygpath -w "$home")
          rc=0
          env HOME="$home" LOCALAPPDATA="$lad" CADENCE_RELEASES_URL="$url/good" CADENCE_TABLES_URL="$url/halftables" \
            bash install.sh --yes --test-urls --tables --version "$v" --dir "$home/bin" > tables-1.txt 2>&1 || rc=$?
          [ "$rc" -ne 0 ] || { cat tables-1.txt; bad "a tablebase download that could not finish exited 0"; }
          said tables-1.txt "Error: could not download " "the stopped download did not say why"
          for n in 2 3; do
            env HOME="$home" LOCALAPPDATA="$lad" CADENCE_RELEASES_URL="$url/good" CADENCE_TABLES_URL="$url/tables" \
              bash install.sh --yes --test-urls --version "$v" > "tables-$n.txt" 2>&1 || { cat "tables-$n.txt"; bad "plain run $n failed"; }
            said "tables-$n.txt" ", so it is up to date." "plain run $n did not find the install up to date"
          done
          said tables-2.txt "An earlier download stopped with 1 of the 290 tables in " "the plain run did not offer the stopped download"
          said tables-2.txt "Download them now? [Y/n]: y (--yes)" "the stopped download was not offered with yes as the default"
          said tables-2.txt "289 downloaded now, 1 already there." "the download did not keep the table it had"
          if grep -qF 'Syzygy tablebases' tables-3.txt; then cat tables-3.txt; bad "a plain run offered the finished tables again"; fi
          # Tables deleted by hand leave no download to finish, so none is offered.
          if [ "$RUNNER_OS" = Windows ]; then rm -rf "$home/Cadence/syzygy"; else rm -rf "$home/.local/share/cadence/syzygy"; fi
          env HOME="$home" LOCALAPPDATA="$lad" CADENCE_RELEASES_URL="$url/good" CADENCE_TABLES_URL="$url/tables" \
            bash install.sh --yes --test-urls --version "$v" > tables-4.txt 2>&1 || { cat tables-4.txt; bad "the plain run after deleting the tables failed"; }
          if grep -qF 'Syzygy tablebases' tables-4.txt; then cat tables-4.txt; bad "a plain run offered tables deleted by hand"; fi

          # An earlier install whose SHA-256 cannot be looked up, because the release list does not
          # answer, is said to be unknown rather than no release's, and kept by default.
          home=$tmp/home-nolist
          mkdir -p "$home"
          lad=$home
          [ "$RUNNER_OS" != Windows ] || lad=$(cygpath -w "$home")
          if [ "$RUNNER_OS" = Windows ]; then st=$home/Cadence/install-state; put=$home/Cadence/cadence.exe; else st=$home/.local/share/cadence/install-state; put=$home/.local/bin/cadence; fi
          mkdir -p "$(dirname "$st")" "$(dirname "$put")"
          printf 'put here by hand\n' > "$put"
          recorded=$put
          [ "$RUNNER_OS" != Windows ] || recorded=$(cygpath -w "$put")
          printf 'binary=%s\n' "$recorded" > "$st"
          rc=0
          env HOME="$home" LOCALAPPDATA="$lad" CADENCE_RELEASES_URL="$url/good" CADENCE_LATEST_URL="$url/latest/9.9.9" \
            CADENCE_API_URL="$url/nolist" bash install.sh --yes --test-urls > nolist.txt 2>&1 || rc=$?
          [ "$rc" -ne 0 ] || { cat nolist.txt; bad "install.sh replaced a file it could not look up"; }
          said nolist.txt "The list of published releases could not be read (the server answered 503), so whether it is a release's binary is not known." \
            "install.sh did not say the release list could not be read"
          said nolist.txt "Replace it with Cadence 9.9.9? [y/N]: n (--yes)" "install.sh did not keep the unknown file by default"
          if grep -qF "no published release's binary" nolist.txt; then bad "install.sh called a lookup that never happened a negative"; fi

          # The installer the candidates were published with, which recorded the binary's path alone.
          curl -fsSL -o published-install.sh https://github.com/grounzero/cadence/releases/download/0.6.0-rc.4/install.sh
          if command -v sha256sum > /dev/null; then sum=$(sha256sum published-install.sh); else sum=$(shasum -a 256 published-install.sh); fi
          [ "${sum%% *}" = 8699db9c460174885ade0d81b502f3efd33ec3be97805c47f865af471127906e ] \
            || bad "0.6.0-rc.4's install.sh is not the one published"
          # The same version is known by its SHA-256. A plain run replaces another release's binary by
          # default and a file put there by hand only if asked; --yes with --version replaces either.
          for kind in same older other; do
            want=$v
            [ "$kind" = same ] || want=$old
            home=$tmp/earlier-$kind
            mkdir -p "$home"
            lad=$home
            [ "$RUNNER_OS" != Windows ] || lad=$(cygpath -w "$home")
            st=$home/.local/share/cadence/install-state
            [ "$RUNNER_OS" != Windows ] || st=$home/Cadence/install-state
            env HOME="$home" LOCALAPPDATA="$lad" bash published-install.sh --yes --version "$want" --dir "$home/bin" \
              > "earlier-$kind-0.txt" 2>&1 || { cat "earlier-$kind-0.txt"; bad "the published installer could not install $want"; }
            grep -q '^binary=' "$st" && ! grep -q '^version=' "$st" || { cat "$st"; bad "the published installer recorded more than the path"; }
            [ "$kind" != other ] || printf 'put here by hand\n' > "$home/bin/cadence$exe"
            if [ "$kind" = same ]; then
              env HOME="$home" LOCALAPPDATA="$lad" bash install.sh --yes --version "$v" --dir "$home/bin" > earlier-same.txt 2>&1 \
                || { cat earlier-same.txt; bad "install.sh failed over the published installer's $want"; }
            else
              rc=0
              env HOME="$home" LOCALAPPDATA="$lad" bash install.sh --yes > "earlier-$kind-plain.txt" 2>&1 || rc=$?
              echo "$rc" > "earlier-$kind-plain.rc"
            fi
          done
          said earlier-same.txt "without recording its version; its SHA-256 is release $v's cadence-$v-" \
            "install.sh did not know the published installer's $v by its SHA-256"
          said earlier-same.txt "Cadence $v is already installed at" "install.sh did not find the published installer's $v up to date"
          grep -qx "version=$v" "$tmp/earlier-same/.local/share/cadence/install-state" "$tmp/earlier-same/Cadence/install-state" 2> /dev/null \
            || bad "install.sh did not record the version it found"
          said earlier-older-plain.txt "without recording its version, and its SHA-256 is none of release $v's." \
            "install.sh did not say the published installer's $old is not $v"
          [ "$(cat earlier-older-plain.rc)" = 0 ] || { cat earlier-older-plain.txt; bad "the plain run over the earlier $old failed"; }
          said earlier-older-plain.txt "Its SHA-256 is that of cadence-$old-" "install.sh did not find the earlier binary among the releases"
          said earlier-older-plain.txt "Replace it with Cadence $v? [Y/n]: y (--yes)" "the plain run did not replace another release's binary by default"
          id=$(printf 'uci\nquit\n' | "$tmp/earlier-older/bin/cadence$exe" | tr -d '\r' | sed -n 's/^id name //p')
          [ "$id" = "Cadence $v" ] || bad "after the replacement the binary calls itself $id"
          [ "$(cat earlier-other-plain.rc)" != 0 ] || { cat earlier-other-plain.txt; bad "the plain run replaced a file put there by hand by default"; }
          said earlier-other-plain.txt "Its SHA-256 is that of no published release's binary." "install.sh did not say the file is no release's"
          said earlier-other-plain.txt "Replace it with Cadence $v? [y/N]: n (--yes)" "the plain run did not keep a file put there by hand by default"
          [ "$(cat "$tmp/earlier-other/bin/cadence$exe")" = 'put here by hand' ] || bad "the file put there by hand was changed"
          env HOME="$tmp/earlier-other" LOCALAPPDATA="$(cygpath -w "$tmp/earlier-other" 2> /dev/null || echo "$tmp/earlier-other")" \
            bash install.sh --yes --version "$v" > earlier-other-pinned.txt 2>&1 \
            || { cat earlier-other-pinned.txt; bad "install.sh --yes --version $v did not install over a file put there by hand"; }
          said earlier-other-pinned.txt "Replacing it with Cadence $v, as --yes and --version $v ask." \
            "install.sh --yes --version did not replace the earlier install"
          id=$(printf 'uci\nquit\n' | "$tmp/earlier-other/bin/cadence$exe" | tr -d '\r' | sed -n 's/^id name //p')
          [ "$id" = "Cadence $v" ] || bad "after --yes --version the binary calls itself $id"

          # A PATH entry this script recorded but no longer finds is not said to be removed.
          home=$tmp/home-marker
          if [ "$RUNNER_OS" = Windows ]; then
            mkdir -p "$home/Cadence"
            printf 'path_windows=%s\n' "$(cygpath -w "$home/nowhere")" > "$home/Cadence/install-state"
            env LOCALAPPDATA="$(cygpath -w "$home")" bash install.sh --yes --uninstall > marker.txt 2>&1 \
              || { cat marker.txt; bad "the uninstall failed"; }
            said marker.txt "is not on your user PATH, so there is nothing to remove there." "the uninstall did not say the entry is gone"
          else
            mkdir -p "$home/.local/share/cadence"
            line="export PATH=\"$home/.local/bin:\$PATH\""
            printf '%s\n%s\n%s\n' '# Added by the Cadence installer' 'export EDITOR=vi' "$line" > "$home/profile"
            printf 'path_rc=%s\npath_line=%s\n' "$home/profile" "$line" > "$home/.local/share/cadence/install-state"
            env HOME="$home" bash install.sh --yes --uninstall > marker.txt 2>&1 || { cat marker.txt; bad "the uninstall failed"; }
            said marker.txt "holds no PATH line under this script's marker, so there is none to remove." \
              "the uninstall did not say there was no marked line"
            [ "$(wc -l < "$home/profile" | tr -d ' ')" = 3 ] || bad "the uninstall changed a profile with no marked line"
          fi
          if grep -qF 'Removed it.' marker.txt; then cat marker.txt; bad "the uninstall said it removed what it did not"; fi
          echo "upgrade, second run, downgrades, builds, the unknown file, the uninstall, the --dir folder, stopped tables and earlier installs held"

      - name: install.ps1 compares versions, and a second run changes nothing
        if: env.SCRIPT == 'install.ps1'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = Join-Path $env:RUNNER_TEMP 'releases'
          $server = Start-Process -FilePath python -ArgumentList (Join-Path $env:RUNNER_TEMP 'serve.py'), '8713' `
            -WorkingDirectory $releases -PassThru -NoNewWindow `
            -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'serve-2.out') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'serve-2.log')
          function Install([string[]]$Arguments) {
            $out = & powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 @Arguments 2>&1 | Out-String
            return @{ Code = $LASTEXITCODE; Out = $out }
          }
          function Said($Run, [string]$Text, [string]$Why) {
            if (-not $Run.Out.Contains($Text)) { Write-Host $Run.Out; throw $Why }
          }
          $saved = $env:LOCALAPPDATA
          try {
            $url = 'http://127.0.0.1:8713'
            $v = $env:RELEASE_VERSION
            $up = $false
            for ($n = 0; $n -lt 30 -and -not $up; $n++) {
              try { Invoke-WebRequest -UseBasicParsing -Uri "$url/tables/sha256" -ErrorAction Stop | Out-Null; $up = $true } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $up) { throw 'the tables are not served' }
            # The published release just below this one, from GitHub's list.
            $listed = Invoke-RestMethod -UseBasicParsing -Uri 'https://api.github.com/repos/grounzero/cadence/releases?per_page=100' `
              -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
            $key = { param($t) if ($t -match '^(\d+)\.(\d+)\.(\d+)(-rc\.(\d+))?$') { '{0:D6}{1:D6}{2:D6}{3}{4:D6}' -f [int]$Matches[1], [int]$Matches[2], [int]$Matches[3], $(if ($Matches[4]) { 0 } else { 1 }), $(if ($Matches[5]) { [int]$Matches[5] } else { 0 }) } }
            $older = @($listed | Where-Object { -not $_.draft -and $_.tag_name -match '^\d+\.\d+\.\d+(-rc\.\d+)?$' -and (& $key $_.tag_name) -lt (& $key $v) } |
              Sort-Object { & $key $_.tag_name })
            if (-not $older) { throw "GitHub lists no published release older than $v" }
            $old = $older[-1].tag_name
            Write-Host "older: $old; this: $v"

            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'home-ps'
            New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
            $app = Join-Path $env:LOCALAPPDATA 'Cadence'
            $bin = Join-Path $app 'cadence.exe'
            $state = Join-Path $app 'install-state'
            $tables = Join-Path $app 'syzygy\3-4-5'
            function Snapshot {
              $lines = foreach ($path in @($bin, $state, $tables)) {
                if (Test-Path $path) {
                  Get-ChildItem -Recurse -File -LiteralPath $path | Sort-Object FullName | ForEach-Object {
                    '{0} {1} {2} {3}' -f $_.FullName, $_.Length, $_.LastWriteTimeUtc.Ticks, (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
                  }
                } else { "absent $path" }
              }
              $lines += [Environment]::GetEnvironmentVariable('Path', 'User')
              return ($lines -join "`n")
            }
            function Marks { @([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_ -eq $app }).Count }
            # A user PATH holding a %VARIABLE%, which every edit must leave unexpanded in a REG_EXPAND_SZ.
            $key = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Environment')
            $raw = [string]$key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
            $key.SetValue('Path', ($raw.TrimEnd(';') + ';%USERPROFILE%\cadence-unexpanded').TrimStart(';'), 'ExpandString')
            $key.Close()
            function Test-Unexpanded([string]$When) {
              $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
              $kind = $key.GetValueKind('Path')
              $raw = [string]$key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
              $key.Close()
              if ($kind -ne 'ExpandString' -or -not $raw.Contains('%USERPROFILE%\cadence-unexpanded')) { throw "$When left the user PATH as $kind $raw" }
            }

            $run = Install @('--yes', '--version', $old)
            if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 could not install $old" }
            if ((Marks) -ne 1) { throw 'the first install did not add one PATH entry' }
            Test-Unexpanded 'the first install'

            $env:CADENCE_TABLES_URL = "$url/tables"
            $run = Install @('--yes', '--test-urls', '--tables', '--version', $v)
            if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 exited $($run.Code) on the upgrade" }
            Said $run "Cadence $old is installed at" 'install.ps1 did not name the installed version'
            Said $run ", and $v is available." 'install.ps1 did not name the version available'
            Said $run "Upgrade it to $($v)? [Y/n]: y (--yes)" 'the upgrade did not default to yes'
            Said $run '290 downloaded now, 0 already there.' 'the tables were not downloaded'
            if ((Marks) -ne 1) { throw 'the upgrade added the PATH entry again' }
            $upgrade = $run

            $before = Snapshot
            $run = Install @('--yes', '--test-urls', '--tables', '--version', $v)
            $after = Snapshot
            if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 exited $($run.Code) on the second run" }
            Said $run "Cadence $v is already installed at" 'the second run did not find the version installed'
            Said $run ', so it is up to date.' 'the second run did not say it is up to date'
            Said $run '0 downloaded now, 290 already there.' 'the second run downloaded tables again'
            if ($before -ne $after) { Write-Host $before; Write-Host $after; throw 'the second run changed what the first installed' }
            Remove-Item Env:CADENCE_TABLES_URL

            # An older release found without --version is a downgrade, declined by default; one named by
            # --version under --yes is taken, and the upgrade then restores this one. A stable one is found
            # through the redirect naming it, and a candidate in the list where the redirect names none.
            New-Item -ItemType Directory -Force -Path (Join-Path $releases 'api-old\releases') | Out-Null
            if ($old -match '-rc\.') {
              Set-Content -Encoding ascii -Path (Join-Path $releases 'api-old\releases\index.html') -Value ('[{"tag_name": "' + $old + '"}]')
              $env:CADENCE_LATEST_URL = "$url/latest/"
            } else {
              Set-Content -Encoding ascii -Path (Join-Path $releases 'api-old\releases\latest') -Value ('{"tag_name": "' + $old + '"}')
              $env:CADENCE_LATEST_URL = "$url/latest/$old"
            }
            $env:CADENCE_API_URL = "$url/api-old/releases"
            foreach ($mode in @('', '--update')) {
              $list = @('--yes', '--test-urls')
              if ($mode) { $list += $mode }
              $run = Install $list
              if ($run.Code -eq 0) { Write-Host $run.Out; throw 'install.ps1 downgraded by default' }
              Said $run "It is newer than $old, so installing $old would be a downgrade." 'the downgrade was not named'
              Said $run "Downgrade it to $($old)? [y/N]: n (--yes)" 'the downgrade did not default to no'
              if ((Snapshot) -ne $after) { throw 'a declined downgrade changed the install' }
            }
            Remove-Item Env:CADENCE_API_URL, Env:CADENCE_LATEST_URL
            $run = Install @('--yes', '--version', $old)
            if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 --yes --version $old exited $($run.Code)" }
            Said $run "Downgrading it to $old, as --yes and --version $old ask." "install.ps1 --yes --version $old did not downgrade"
            $run = Install @('--yes', '--version', $v)
            if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 could not upgrade back to $v" }
            Said $run "Upgrade it to $($v)? [Y/n]: y (--yes)" "the upgrade back to $v was not offered"

            # A build from source asked for at the same version replaces the release binary installed, and
            # a SOURCE naming another commit then stops it before anything is built. Asking for the generic
            # binary replaces the AVX2 or AVX-512 one, and --build avx512 is refused on a processor without
            # AVX-512.
            $releasesUrl = $env:CADENCE_RELEASES_URL
            $path = $env:Path
            $env:CADENCE_RELEASES_URL = "$url/source-wrong"
            $env:Path = (Join-Path $env:RUNNER_TEMP 'fake-gh-cmd') + ';' + $env:Path
            $env:FAKE_GH = 'setup'
            $env:FAKE_GH_ARGS = Join-Path $env:RUNNER_TEMP 'gh-args-2.txt'
            try {
              $run = Install @('--yes', '--test-urls', '--source', '--version', $v)
            } finally {
              $env:Path = $path
              if ($releasesUrl) { $env:CADENCE_RELEASES_URL = $releasesUrl } else { Remove-Item Env:CADENCE_RELEASES_URL -ErrorAction SilentlyContinue }
              Remove-Item Env:FAKE_GH, Env:FAKE_GH_ARGS -ErrorAction SilentlyContinue
            }
            if ($run.Code -eq 0) { Write-Host $run.Out; throw "install.ps1 built a source that is not the commit its release's SOURCE names" }
            Said $run 'and --source asks for it built from source, so it is replaced.' 'install.ps1 took --source at the same version as up to date'
            Said $run 'SOURCE names commit 0000000000000000000000000000000000000000, and its tag names' 'the SOURCE naming another commit did not stop the build'
            if ($upgrade.Out.Contains('the AVX2 build runs here') -or $upgrade.Out.Contains('the AVX-512 build runs here')) {
              $was = "$(@(Get-Content $state) -match '^build=')" -replace '^build=', ''
              $run = Install @('--yes', '--generic', '--version', $v)
              if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 exited $($run.Code) installing the generic build over the $was one" }
              Said $run " in the $was build, and the generic build is asked for, so it is replaced." "install.ps1 did not replace the $was build with the generic one"
              if (@(Get-Content $state) -notcontains 'build=generic') { throw 'the state does not record the generic build' }
              $run = Install @('--yes', '--version', $v)
              Said $run ', so it is up to date.' 'a plain run did not take the generic build as up to date'
            }
            if (-not $upgrade.Out.Contains('the AVX-512 build runs here')) {
              $run = Install @('--yes', '--build', 'avx512', '--version', $v)
              if ($run.Code -eq 0) { Write-Host $run.Out; throw 'install.ps1 took --build avx512 on a processor without AVX-512' }
              Said $run '--build avx512 needs AVX-512F, AVX-512BW, AVX2, BMI1, LZCNT and POPCNT, and this processor lacks' 'install.ps1 did not say why it refused --build avx512'
            }

            # A file the script has no record of, which leaves a mark if it is run.
            Copy-Item -Force (Join-Path $env:RUNNER_TEMP 'marker.exe') $bin
            $run = Install @('--yes', '--update', '--version', $v)
            if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 exited $($run.Code) replacing a file it did not install" }
            Said $run 'whose version this script has no record of.' 'install.ps1 did not say the file there is unknown to it'
            Said $run 'Replace it? [Y/n]: y (--yes)' 'the replacement under --update did not default to yes'
            if (Test-Path (Join-Path $env:RUNNER_TEMP 'ran.txt')) { throw 'install.ps1 ran the file at the install path' }

            # What the installs recorded installing to build, named by the uninstall and left alone.
            [System.IO.File]::AppendAllText($state, "installed_rust=rustup and every Rust toolchain it holds, which 'rustup self uninstall' removes`n")
            $run = Install @('--yes', '--uninstall')
            if ($run.Code -ne 0) { Write-Host $run.Out; throw "the uninstall exited $($run.Code)" }
            Said $run "To build Cadence, this installer also installed rustup and every Rust toolchain it holds, which 'rustup self uninstall' removes." 'the uninstall did not name the Rust it installed'
            foreach ($path in @($bin, $tables, $state)) { if (Test-Path $path) { throw "the uninstall left $path" } }
            if ((Marks) -ne 0) { throw 'the uninstall left the PATH entry' }
            Test-Unexpanded 'the uninstall'
            $run = Install @('--yes', '--uninstall')
            Said $run 'There is no Cadence at' 'a second uninstall did not find nothing to remove'

            # A plain run after a --dir install finds that folder in the state, and the uninstall removes
            # the binary there; no second copy goes into the default folder.
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'home-dir'
            New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
            $chosen = Join-Path $env:RUNNER_TEMP 'chosen'
            $env:CADENCE_RELEASES_URL = "$url/good"
            $run = Install @('--yes', '--test-urls', '--version', $v, '--dir', $chosen)
            if ($run.Code -ne 0) { Write-Host $run.Out; throw 'the --dir install failed' }
            $run = Install @('--yes', '--test-urls', '--version', $v)
            if ($run.Code -ne 0) { Write-Host $run.Out; throw 'the plain run after the --dir install failed' }
            Said $run "Cadence $v is already installed at $chosen\cadence.exe, so it is up to date." 'the plain run did not find the --dir install'
            if (Test-Path (Join-Path $env:LOCALAPPDATA 'Cadence\cadence.exe')) { throw 'the plain run installed a second copy in the default folder' }
            $run = Install @('--yes', '--test-urls', '--uninstall')
            if ($run.Code -ne 0) { Write-Host $run.Out; throw 'the uninstall failed' }
            if (Test-Path (Join-Path $chosen 'cadence.exe')) { throw 'the uninstall left the binary in the --dir folder' }

            # A run into another folder offers to remove the copy the state records and its PATH entry, yes
            # by default, so the uninstall after it leaves nothing behind.
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'home-moved'
            New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
            $firstFolder = Join-Path $env:LOCALAPPDATA 'Cadence'
            $elsewhere = Join-Path $env:LOCALAPPDATA 'elsewhere'
            $run = Install @('--yes', '--test-urls', '--version', $v)
            if ($run.Code -ne 0) { Write-Host $run.Out; throw 'the first install failed' }
            if (-not (Test-Path (Join-Path $firstFolder 'cadence.exe'))) { throw 'the first install put nothing in the default folder' }
            $moved = Install @('--yes', '--test-urls', '--version', $v, '--dir', $elsewhere)
            if ($moved.Code -ne 0) { Write-Host $moved.Out; throw 'the install into another folder failed' }
            Said $moved 'An earlier run installed Cadence at' 'the run into another folder did not name the earlier copy'
            Said $moved 'Remove that copy, and the PATH entry this script added for it? [Y/n]: y (--yes)' "the earlier copy's removal was not offered with yes as the default"
            if (Test-Path (Join-Path $firstFolder 'cadence.exe')) { throw 'the earlier copy was left' }
            if (@([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_ -eq $firstFolder }).Count -ne 0) { throw "the earlier copy's PATH entry was left" }
            $run = Install @('--yes', '--test-urls', '--uninstall')
            if ($run.Code -ne 0) { Write-Host $run.Out; throw 'the uninstall after the move failed' }
            foreach ($copy in @((Join-Path $firstFolder 'cadence.exe'), (Join-Path $elsewhere 'cadence.exe'))) { if (Test-Path $copy) { throw "the uninstall left $copy" } }
            # With everything gone, so are the record and the folder holding it and the log.
            if (Test-Path $firstFolder) { Get-ChildItem -Force -Recurse $firstFolder | Out-Host; throw "the uninstall left the folder $firstFolder" }
            Said $run "Removed the empty folder $firstFolder." 'the uninstall did not say it removed its folder'

            # What the user keeps is kept in the record, which the uninstall keeps for it. The answers go
            # to standard input after a line no question takes, which a byte order mark would spoil.
            $keptHome = Join-Path $env:RUNNER_TEMP 'home-kept'
            $env:LOCALAPPDATA = $keptHome
            New-Item -ItemType Directory -Force -Path $keptHome | Out-Null
            $keptBin = Join-Path $keptHome 'Cadence\cadence.exe'
            $keptState = Join-Path $keptHome 'Cadence\install-state'
            $run = Install @('--yes', '--test-urls', '--version', $v)
            if ($run.Code -ne 0) { Write-Host $run.Out; throw 'the install before a kept uninstall failed' }
            $info = New-Object System.Diagnostics.ProcessStartInfo
            $info.FileName = 'powershell.exe'
            $info.Arguments = '-NoProfile -ExecutionPolicy Bypass -File install.ps1 --test-urls --uninstall'
            $info.WorkingDirectory = $PWD.Path
            $info.UseShellExecute = $false
            $info.RedirectStandardInput = $true
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            $process = [System.Diagnostics.Process]::Start($info)
            $said = $process.StandardOutput.ReadToEndAsync()
            $errors = $process.StandardError.ReadToEndAsync()
            $process.StandardInput.Write("x`nn`ny`n")
            $process.StandardInput.Close()
            if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'the uninstall answered on standard input did not finish' }
            $kept = @{ Code = $process.ExitCode; Out = $said.Result + $errors.Result }
            if ($kept.Code -ne 0) { Write-Host $kept.Out; throw "the kept uninstall exited $($kept.Code)" }
            if (-not (Test-Path $keptBin)) { Write-Host $kept.Out; throw 'the uninstall removed the binary the user kept' }
            $record = @(Get-Content $keptState)
            if ($record -notcontains "binary=$keptBin") { Write-Host $kept.Out; Write-Host ($record -join "`n"); throw 'the record of the kept binary was not kept' }
            if ($record -match '^path_windows=') { Write-Host ($record -join "`n"); throw 'the record kept the PATH entry that was removed' }
            Said $kept "is kept for what stays: Cadence at $keptBin." 'the uninstall did not say why the record stays'
            $run = Install @('--yes', '--test-urls', '--uninstall')
            if ($run.Code -ne 0) { Write-Host $run.Out; throw 'the uninstall after a kept one failed' }
            if ((Test-Path $keptBin) -or (Test-Path $keptState)) { throw 'the second uninstall left the binary or the record' }
            if (Test-Path (Join-Path $keptHome 'Cadence')) { throw 'the second uninstall left its folder' }
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'home-moved'

            # An earlier copy changed since it was installed may be the user's own, so it is kept by default.
            $run = Install @('--yes', '--test-urls', '--version', $v)
            if ($run.Code -ne 0) { Write-Host $run.Out; throw 'the first install failed' }
            Set-Content -Encoding ascii -Path (Join-Path $firstFolder 'cadence.exe') -Value 'changed by hand'
            $changed = Install @('--yes', '--test-urls', '--version', $v, '--dir', $elsewhere)
            if ($changed.Code -ne 0) { Write-Host $changed.Out; throw 'the install beside a changed copy failed' }
            Said $changed 'It has changed since it was installed: its SHA-256 is not the one recorded.' 'the changed copy was not named as changed'
            Said $changed 'Remove that copy, and the PATH entry this script added for it? [y/N]: n (--yes)' "the changed copy's removal did not default to no"
            if ((Get-Content -Raw (Join-Path $firstFolder 'cadence.exe')).Trim() -ne 'changed by hand') { throw 'the changed copy was removed or rewritten' }

            # The folder the state records, spelled with a trailing separator or reached through a junction,
            # is that folder: the install in it is found up to date and is never removed.
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'home-spelled'
            $realDir = Join-Path $env:LOCALAPPDATA 'real'
            New-Item -ItemType Directory -Force -Path $realDir | Out-Null
            $run = Install @('--yes', '--test-urls', '--version', $v, '--dir', ($realDir + '\'))
            if ($run.Code -ne 0) { Write-Host $run.Out; throw 'the install with a trailing separator failed' }
            if (@(Get-Content (Join-Path $env:LOCALAPPDATA 'Cadence\install-state')) -notcontains "binary=$realDir\cadence.exe") { throw 'the state did not record the folder without its trailing separator' }
            $link = Join-Path $env:LOCALAPPDATA 'link'
            New-Item -ItemType Junction -Path $link -Target $realDir | Out-Null
            # A subst drive spells the same folder with another letter.
            $drive = @('Q', 'R', 'S', 'T', 'U', 'V', 'W', 'X', 'Y', 'Z' | Where-Object { -not (Test-Path ($_ + ':\')) })[0]
            & subst.exe "$($drive):" $env:LOCALAPPDATA
            try {
              foreach ($dir in @($realDir, $link, ($link + '\'), "$($drive):\real")) {
                $run = Install @('--yes', '--test-urls', '--version', $v, '--dir', $dir)
                if ($run.Code -ne 0) { Write-Host $run.Out; throw "the run with --dir $dir failed" }
                Said $run ', so it is up to date.' "--dir $dir was not taken for the folder installed in"
                if ($run.Out.Contains('An earlier run installed Cadence at')) { Write-Host $run.Out; throw "--dir $dir offered to remove the install in its own folder" }
                if (-not (Test-Path (Join-Path $realDir 'cadence.exe'))) { throw "--dir $dir removed the install" }
              }
            } finally {
              & subst.exe "$($drive):" /D
            }

            # A build recorded as baseline was made where the target has no AVX2 or generic settings, so
            # any build asked for there is that one, and nothing is rebuilt.
            $stateFile = Join-Path $env:LOCALAPPDATA 'Cadence\install-state'
            Set-Content -Encoding ascii -Path $stateFile -Value (@(Get-Content $stateFile) -replace '^build=.*$', 'build=baseline')
            $builds = @(@('--generic'), @('--build', 'avx2'))
            if ($upgrade.Out.Contains('the AVX-512 build runs here')) { $builds += , @('--build', 'avx512') }
            foreach ($build in $builds) {
              $run = Install (@('--yes', '--test-urls', '--version', $v, '--dir', $realDir) + $build)
              if ($run.Code -ne 0) { Write-Host $run.Out; throw "the run with $build over a baseline build failed" }
              Said $run ', so it is up to date.' "$build was not taken for the baseline build installed"
            }

            # A tablebase download that stopped is offered again by a plain run, yes by default, and keeps
            # what it already has; once finished, a plain run does not offer it.
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'home-tables'
            New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
            $env:CADENCE_TABLES_URL = "$url/halftables"
            $run = Install @('--yes', '--test-urls', '--tables', '--version', $v, '--dir', (Join-Path $env:LOCALAPPDATA 'bin'))
            if ($run.Code -eq 0) { Write-Host $run.Out; throw 'a tablebase download that could not finish exited 0' }
            Said $run 'Error: could not download ' 'the stopped download did not say why'
            $env:CADENCE_TABLES_URL = "$url/tables"
            $again = Install @('--yes', '--test-urls', '--version', $v)
            $last = Install @('--yes', '--test-urls', '--version', $v)
            foreach ($plain in @($again, $last)) {
              if ($plain.Code -ne 0) { Write-Host $plain.Out; throw 'a plain run after the stopped download failed' }
              Said $plain ', so it is up to date.' 'a plain run did not find the install up to date'
            }
            Said $again 'An earlier download stopped with 1 of the 290 tables in ' 'the plain run did not offer the stopped download'
            Said $again 'Download them now? [Y/n]: y (--yes)' 'the stopped download was not offered with yes as the default'
            Said $again '289 downloaded now, 1 already there.' 'the download did not keep the table it had'
            if ($last.Out.Contains('Syzygy tablebases')) { Write-Host $last.Out; throw 'a plain run offered the finished tables again' }
            # Tables deleted by hand leave no download to finish, so none is offered.
            Remove-Item -Recurse -Force (Join-Path $env:LOCALAPPDATA 'Cadence\syzygy')
            $gone = Install @('--yes', '--test-urls', '--version', $v)
            if ($gone.Code -ne 0) { Write-Host $gone.Out; throw 'the plain run after deleting the tables failed' }
            if ($gone.Out.Contains('Syzygy tablebases')) { Write-Host $gone.Out; throw 'a plain run offered tables deleted by hand' }

            # An earlier install whose SHA-256 cannot be looked up, because the release list does not
            # answer, is said to be unknown rather than no release's, and kept by default.
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'home-nolist'
            $put = Join-Path $env:LOCALAPPDATA 'Cadence\cadence.exe'
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $put) | Out-Null
            Set-Content -Encoding ascii -Path $put -Value 'put here by hand'
            Set-Content -Encoding ascii -Path (Join-Path $env:LOCALAPPDATA 'Cadence\install-state') -Value "binary=$put"
            $env:CADENCE_LATEST_URL = "$url/latest/9.9.9"
            $env:CADENCE_API_URL = "$url/nolist"
            $run = Install @('--yes', '--test-urls')
            Remove-Item Env:CADENCE_API_URL, Env:CADENCE_LATEST_URL
            if ($run.Code -eq 0) { Write-Host $run.Out; throw 'install.ps1 replaced a file it could not look up' }
            Said $run "The list of published releases could not be read (the server answered 503), so whether it is a release's binary is not known." 'install.ps1 did not say the release list could not be read'
            Said $run 'Replace it with Cadence 9.9.9? [y/N]: n (--yes)' 'install.ps1 did not keep the unknown file by default'
            if ($run.Out.Contains("no published release's binary")) { throw 'install.ps1 called a lookup that never happened a negative' }

            # The session PATH is read as install.sh reads it, and the tables are said to be removed only
            # once they are.
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'home-session'
            New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
            $session = Join-Path $env:LOCALAPPDATA 'Cadence'
            $path = $env:Path
            $env:Path = "$session;$env:Path"
            try {
              $run = Install @('--yes', '--test-urls', '--tables', '--version', $v)
            } finally {
              $env:Path = $path
            }
            if ($run.Code -ne 0) { Write-Host $run.Out; throw 'the install with its folder on the session PATH failed' }
            Said $run "$session is already on your PATH." 'install.ps1 did not read the session PATH'
            if (@([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_ -eq $session }).Count -ne 0) { throw 'install.ps1 added a folder already on the session PATH to the user PATH' }
            $table = Get-ChildItem -File -Path (Join-Path $session 'syzygy\3-4-5') | Select-Object -First 1
            $lock = [System.IO.File]::Open($table.FullName, 'Open', 'Read', 'None')
            try {
              $run = Install @('--yes', '--test-urls', '--uninstall')
            } finally {
              $lock.Close()
            }
            if ($run.Code -eq 0) { Write-Host $run.Out; throw 'the uninstall exited 0 with a table it could not remove' }
            if ($run.Out.Contains('Removed them.')) { Write-Host $run.Out; throw 'install.ps1 said the tables were removed when one was not' }
            Said $run 'Error: could not remove ' 'install.ps1 did not say the tables could not be removed'
            Remove-Item Env:CADENCE_RELEASES_URL, Env:CADENCE_TABLES_URL

            # The installer the candidates were published with, which recorded the binary's path alone.
            $published = Join-Path $env:RUNNER_TEMP 'published-install.ps1'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/grounzero/cadence/releases/download/0.6.0-rc.4/install.ps1' -OutFile $published
            if ((Get-FileHash -Algorithm SHA256 $published).Hash -ne '43c1658df17ae918b9fd725ab9c06e2b7ee26046f19de1ead80fbe71895f69ee') { throw "0.6.0-rc.4's install.ps1 is not the one published" }
            # The same version is known by its SHA-256. A plain run replaces another release's binary by
            # default and a file put there by hand only if asked; --yes with --version replaces either.
            $earlier = @{}
            $plain = @{}
            foreach ($kind in @('same', 'older', 'other')) {
              $want = if ($kind -eq 'same') { $v } else { $old }
              $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "earlier-$kind"
              New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
              $dir = Join-Path $env:LOCALAPPDATA 'bin'
              $out = & powershell -NoProfile -ExecutionPolicy Bypass -File $published --yes --version $want --dir $dir 2>&1 | Out-String
              if ($LASTEXITCODE -ne 0) { Write-Host $out; throw "the published installer could not install $want" }
              $recorded = @(Get-Content (Join-Path $env:LOCALAPPDATA 'Cadence\install-state'))
              if (-not ($recorded -match '^binary=') -or ($recorded -match '^version=')) { throw 'the published installer recorded more than the path' }
              if ($kind -eq 'other') { Set-Content -Encoding ascii -Path (Join-Path $dir 'cadence.exe') -Value 'put here by hand' }
              if ($kind -eq 'same') {
                $earlier[$kind] = Install @('--yes', '--version', $v, '--dir', $dir)
                if ($earlier[$kind].Code -ne 0) { Write-Host $earlier[$kind].Out; throw "install.ps1 exited $($earlier[$kind].Code) over the published installer's $want" }
              } else {
                $plain[$kind] = Install @('--yes')
              }
            }
            Said $earlier['same'] "without recording its version; its SHA-256 is release $v's cadence-$v-" "install.ps1 did not know the published installer's $v by its SHA-256"
            Said $earlier['same'] "Cadence $v is already installed at" "install.ps1 did not find the published installer's $v up to date"
            if (@(Get-Content (Join-Path $env:RUNNER_TEMP 'earlier-same\Cadence\install-state')) -notcontains "version=$v") { throw 'install.ps1 did not record the version it found' }
            Said $plain['older'] "without recording its version, and its SHA-256 is none of release $v's." "install.ps1 did not say the published installer's $old is not $v"
            if ($plain['older'].Code -ne 0) { Write-Host $plain['older'].Out; throw "the plain run over the earlier $old failed" }
            Said $plain['older'] "Its SHA-256 is that of cadence-$old-" 'install.ps1 did not find the earlier binary among the releases'
            Said $plain['older'] "Replace it with Cadence $($v)? [Y/n]: y (--yes)" "the plain run did not replace another release's binary by default"
            # An empty line first, which takes the byte order mark Windows PowerShell pipes in.
            $id = "`nuci`nquit`n" | & (Join-Path $env:RUNNER_TEMP 'earlier-older\bin\cadence.exe') | Where-Object { $_ -match '^id name ' }
            if ("$id" -ne "id name Cadence $v") { throw "after the replacement the binary calls itself $id" }
            if ($plain['other'].Code -eq 0) { Write-Host $plain['other'].Out; throw 'the plain run replaced a file put there by hand by default' }
            Said $plain['other'] "Its SHA-256 is that of no published release's binary." "install.ps1 did not say the file is no release's"
            Said $plain['other'] "Replace it with Cadence $($v)? [y/N]: n (--yes)" 'the plain run did not keep a file put there by hand by default'
            if ((Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'earlier-other\bin\cadence.exe')).Trim() -ne 'put here by hand') { throw 'the file put there by hand was changed' }
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'earlier-other'
            $run = Install @('--yes', '--version', $v)
            if ($run.Code -ne 0) { Write-Host $run.Out; throw "install.ps1 --yes --version $v did not install over a file put there by hand" }
            Said $run "Replacing it with Cadence $v, as --yes and --version $v ask." 'install.ps1 --yes --version did not replace the earlier install'
            $id = "`nuci`nquit`n" | & (Join-Path $env:RUNNER_TEMP 'earlier-other\bin\cadence.exe') | Where-Object { $_ -match '^id name ' }
            if ("$id" -ne "id name Cadence $v") { throw "after --yes --version the binary calls itself $id" }

            # A PATH entry this script recorded but no longer finds is not said to be removed.
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'home-marker'
            New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALAPPDATA 'Cadence') | Out-Null
            Set-Content -Encoding ascii -Path (Join-Path $env:LOCALAPPDATA 'Cadence\install-state') -Value ('path_windows=' + (Join-Path $env:LOCALAPPDATA 'nowhere'))
            $run = Install @('--yes', '--uninstall')
            if ($run.Code -ne 0) { Write-Host $run.Out; throw 'the uninstall failed' }
            Said $run 'is not on your user PATH, so there is nothing to remove there.' 'the uninstall did not say the entry is gone'
            if ($run.Out.Contains('Removed it.')) { Write-Host $run.Out; throw 'the uninstall said it removed what it did not' }
            Write-Host 'upgrade, second run, downgrades, builds, the unknown file, the uninstall, the --dir folder, stopped tables, the session PATH and earlier installs held'
          } finally {
            $env:LOCALAPPDATA = $saved
            Remove-Item Env:CADENCE_TABLES_URL -ErrorAction SilentlyContinue
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
          # The step's shell exits with the last native exit code, which a refused install left at 1.
          exit 0

      # One state for both installers on Windows: Windows paths in UTF-8 without a byte order mark,
      # each reading what the other writes and what the published candidates' installers wrote, and
      # each uninstalling what the other installed, its PATH entry with it.
      - name: The two installers share one state on Windows
        if: runner.os == 'Windows' && env.SCRIPT == 'install.sh'
        run: |
          tmp=$(cygpath -u "$RUNNER_TEMP")
          (cd "$tmp/releases" && exec python "$tmp/serve.py" 8714) > "$tmp/serve-3.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2> /dev/null || true' EXIT
          url=http://127.0.0.1:8714
          for i in $(seq 30); do curl -fs -o /dev/null "$url/good/$RELEASE_VERSION/SHA256SUMS" && break; sleep 1; done
          v=$RELEASE_VERSION
          bad() { echo "::error::$*"; exit 1; }
          said() { grep -qF -- "$2" "$1" || { cat "$1"; bad "$3"; }; }
          export CADENCE_RELEASES_URL="$url/good"
          curl -fsSL -o published-install.sh https://github.com/grounzero/cadence/releases/download/0.6.0-rc.4/install.sh
          curl -fsSL -o published-install.ps1 https://github.com/grounzero/cadence/releases/download/0.6.0-rc.4/install.ps1
          for pinned in published-install.sh:8699db9c460174885ade0d81b502f3efd33ec3be97805c47f865af471127906e \
            published-install.ps1:43c1658df17ae918b9fd725ab9c06e2b7ee26046f19de1ead80fbe71895f69ee; do
            [ "$(sha256sum "${pinned%%:*}" | awk '{print $1}')" = "${pinned#*:}" ] \
              || bad "0.6.0-rc.4's ${pinned%%:*} is not the one published"
          done
          # Either script, the published ones without --test-urls, which they do not know.
          installer() {
            local script=$1 out=$2 test=--test-urls
            shift 2
            case "$script" in published-*) test="" ;; esac
            case "$script" in
              *.ps1) powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$script" --yes $test "$@" > "$out" 2>&1 ;;
              *) bash "$script" --yes $test "$@" > "$out" 2>&1 ;;
            esac || { cat "$out"; bad "$script $* failed"; }
          }
          on_path() {
            powershell.exe -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path', 'User')" | tr -d '\r' | tr ';' '\n' \
              | grep -cixF "$(cygpath -w "$app")" || true
          }
          # No user PATH at all to begin with, so each uninstall must remove the value it empties rather
          # than leave it empty; the PATH there before is put back at the end.
          saved=$(powershell.exe -NoProfile -Command "\$k = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment'); if (\$k.GetValueNames() -contains 'Path') { '{0}|{1}' -f \$k.GetValueKind('Path'), \$k.GetValue('Path', '', 'DoNotExpandEnvironmentNames') }" | tr -d '\r')
          powershell.exe -NoProfile -Command "[Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Environment').DeleteValue('Path', \$false)"
          path_held() {
            powershell.exe -NoProfile -Command "[string]([Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment').GetValueNames() -contains 'Path')" | tr -d '\r'
          }
          # One home each: the first installer installs, then the second finds it up to date and
          # uninstalls it.
          for pair in "install.ps1 install.sh" "install.sh install.ps1" "published-install.sh install.ps1" "published-install.ps1 install.sh"; do
            set -- $pair
            first=$1 second=$2
            home=$tmp/shared-${first%%.*}-${first##*.}
            mkdir -p "$home"
            LOCALAPPDATA=$(cygpath -w "$home")
            export LOCALAPPDATA
            app=$home/Cadence
            state=$app/install-state
            installer "$first" "$home.first.txt" --version "$v"
            [ "$(on_path)" = 1 ] || bad "$first did not add $app to the user PATH"
            case "$first" in
              install.*)
                [ "$(head -c 3 "$state" | od -An -tx1 | tr -d ' \n')" != efbbbf ] || bad "$first wrote a byte order mark"
                if grep -q $'\r' "$state"; then bad "$first wrote carriage returns"; fi
                grep -qE '^binary=[A-Za-z]:\\' "$state" || { cat "$state"; bad "$first did not record a Windows path"; }
                ;;
            esac
            installer "$second" "$home.second.txt" --version "$v"
            said "$home.second.txt" "Cadence $v is already installed at" "$second did not find $first's install up to date"
            installer "$second" "$home.third.txt" --uninstall
            [ ! -e "$app/cadence.exe" ] || { cat "$home.third.txt"; bad "$second's uninstall left $first's binary"; }
            [ ! -e "$state" ] || bad "$second's uninstall left the state"
            [ "$(on_path)" = 0 ] || bad "$second's uninstall left $first's PATH entry"
            [ "$(path_held)" = False ] || bad "$second's uninstall left an empty user PATH"
          done
          if [ -n "$saved" ]; then
            CADENCE_KIND=${saved%%|*} CADENCE_PATH=${saved#*|} powershell.exe -NoProfile -Command \
              "[Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Environment').SetValue('Path', \$env:CADENCE_PATH, \$env:CADENCE_KIND)"
          fi
          echo "both installers read, write and uninstall one state"

      - name: The logs, when an install failed
        if: failure()
        shell: bash
        run: |
          for log in "$HOME"/.cache/cadence/install-*.log "$(cygpath -u "${LOCALAPPDATA:-/nowhere}" 2>/dev/null)"/Cadence/install-*.log; do
            [ -f "$log" ] && { echo "== $log"; cat "$log"; }
          done
          true

  install-linux-aarch64:
    name: install.sh, Linux aarch64
    needs: changes
    if: *install-when
    runs-on: ubuntu-24.04-arm
    env:
      GITHUB_TOKEN: ${{ github.token }}
      LEG: install.sh, Linux aarch64
      SCRIPT: install.sh
      ASSET: linux-aarch64
    defaults: *install-defaults
    steps: *install-steps

  install-macos-arm64:
    name: install.sh, macOS arm64
    needs: changes
    if: *install-when
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      LEG: install.sh, macOS arm64
      SCRIPT: install.sh
      ASSET: macos-arm64
    defaults: *install-defaults
    steps: *install-steps

  install-macos-x86-64:
    name: install.sh, macOS x86-64
    needs: changes
    if: *install-when
    runs-on: macos-26-intel
    env:
      GITHUB_TOKEN: ${{ github.token }}
      LEG: install.sh, macOS x86-64
      SCRIPT: install.sh
      ASSET: macos-x86-64
    defaults: *install-defaults
    steps: *install-steps

  install-git-bash:
    name: install.sh, Windows Git Bash
    needs: changes
    if: *install-when
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      LEG: install.sh, Windows Git Bash
      SCRIPT: install.sh
      ASSET: windows-x86-64-avx2
    defaults: *install-defaults
    steps: *install-steps

  install-powershell:
    name: install.ps1, Windows PowerShell
    needs: changes
    if: *install-when
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      LEG: install.ps1, Windows PowerShell
      SCRIPT: install.ps1
      ASSET: windows-x86-64-avx2
    defaults: *install-defaults
    steps: *install-steps

  # install.sh --source at the newest +n base, which must install under the base's -dev- name. Then
  # the same base built under the release's name, which the script must refuse.
  install-source:
    name: install.sh --source, Linux x86-64
    needs: changes
    if: *install-when
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read from the public repository as the script reads its tags, and fetched here so the checks
      # below hold the build to the base's own commit and bench.txt.
      - name: The newest +n base
        run: |
          base=$(git ls-remote --tags --refs https://github.com/grounzero/cadence.git \
            | sed -n 's#.*refs/tags/##p' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$' | sort -V | tail -n 1)
          [ -n "$base" ] || { echo "::error::the repository has no +n tag"; exit 1; }
          git fetch --quiet --depth 1 origin "+refs/tags/$base:refs/tags/$base"
          commit=$(git rev-parse "$base^{commit}" | cut -c1-7)
          echo "the newest +n base is $base, at $commit"
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "DEV_NAME=Cadence ${base%%+*}-dev-$commit" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Cadence ${base%%+*}" >> "$GITHUB_ENV"

      - name: install.sh --source installs the +n base under its -dev- name
        run: |
          bash install.sh --yes --source --version "$BASE" --prefix "$RUNNER_TEMP/plus" 2>&1 | tee plus.txt
          grep -qF '== Building from source, as --source asks' plus.txt \
            || { echo "::error::install.sh did not build from source"; exit 1; }
          grep -qF "the engine calls itself $DEV_NAME." plus.txt \
            || { echo "::error::install.sh did not take $DEV_NAME"; exit 1; }
          bin="$RUNNER_TEMP/plus/cadence"
          [ -x "$bin" ] || { echo "::error::nothing installed at $bin"; exit 1; }
          want=$(git show "$BASE:bench.txt" | tr -d '[:space:]')
          got=$("$bin" bench | tail -n 1 | awk '{print $1}')
          id=$(printf 'uci\nquit\n' | "$bin" | sed -n 's/^id name //p')
          echo "installed $bin: bench $got against $want, id name $id"
          [ "$got" = "$want" ] || { echo "::error::the build's bench is $got and $BASE's bench.txt says $want"; exit 1; }
          [ "$id" = "$DEV_NAME" ] || { echo "::error::the build calls itself $id and not $DEV_NAME"; exit 1; }
          printf '### %s\n%s installed, bench %s\n' "install.sh --source $BASE" "$id" "$got" >> "$GITHUB_STEP_SUMMARY"

      # A git that answers the build script's tag question with the version makes the +n source call
      # itself the release, and passes every other call through.
      - name: install.sh refuses the +n base built under the release's name
        run: |
          real=$(command -v git)
          mkdir -p "$RUNNER_TEMP/release-git"
          cat > "$RUNNER_TEMP/release-git/git" <<EOF
          #!/bin/sh
          [ "\$1" = describe ] && { echo "${BASE%%+*}"; exit 0; }
          exec "$real" "\$@"
          EOF
          chmod 755 "$RUNNER_TEMP/release-git/git"
          rc=0
          PATH="$RUNNER_TEMP/release-git:$PATH" bash install.sh --yes --source --version "$BASE" \
            --prefix "$RUNNER_TEMP/misnamed" 2>&1 | tee misnamed.txt || rc=$?
          [ "$rc" -ne 0 ] || { echo "::error::install.sh installed a +n build that calls itself the release"; exit 1; }
          grep -qF "it calls itself '$RELEASE_NAME' and not '$DEV_NAME', so it is not installed" misnamed.txt \
            || { echo "::error::install.sh failed, but not for the build's name"; exit 1; }
          [ ! -e "$RUNNER_TEMP/misnamed/cadence" ] || { echo "::error::a binary was installed"; exit 1; }
          grep -qF 'Attach this file to a GitHub issue' misnamed.txt \
            || { echo "::error::no note to attach the log"; exit 1; }
          echo "refused, as it must be: $(grep -F 'it calls itself' misnamed.txt | tail -n 1)"

      - name: The logs, when an install failed
        if: failure()
        run: |
          for log in "$HOME"/.cache/cadence/install-*.log; do
            [ -f "$log" ] && { echo "== $log"; cat "$log"; }
          done
          true

  # The `#[cfg(kani)]` proofs, by bounded model checking at one pinned Kani release, which brings its
  # own toolchain. A gate: a failed proof fails the run.
  kani:
    name: kani
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # A docs or tests-only pull request changes no proof and no code a proof reads, so it passes here.
    env:
      PROVE: ${{ needs.changes.outputs.kind != 'docs' && needs.changes.outputs.kind != 'tests' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Kani 0.68.0
        if: env.PROVE == 'true'
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup

      # Each proof gets ten minutes, so one that cannot finish fails by name and the rest still run.
      - name: The proofs
        if: env.PROVE == 'true'
        run: cargo kani -p cadence-core -p cadence-engine -Z unstable-options --harness-timeout 10m
