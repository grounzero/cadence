          # never built, though --source asks; nor is a SOURCE whose attestation gh refuses.
          rc=0
          from_source source-wrong source-wrong setup || rc=$?
          [ "$rc" -ne 0 ] || { cat source-wrong.txt; bad "install.sh built a source that is not the commit its release's SOURCE names"; }
          said source-wrong.txt "release $v's SOURCE names commit 0000000000000000000000000000000000000000, and its tag names $TAG_COMMIT, so it is not built" \
            "install.sh did not refuse a source that is not the commit its release's SOURCE names"
          rc=0
          from_source source-bench source-bench setup || rc=$?
          [ "$rc" -ne 0 ] || { cat source-bench.txt; bad "install.sh built a source whose bench.txt is not the release's"; }
          said source-bench.txt "release $v's bench.txt says $((count + 1)) and the source at its tag says $count, so it is not built" \
            "install.sh did not refuse a source whose bench.txt is not the release's"
          rc=0
          from_source source-verdict source-right verdict || rc=$?
          [ "$rc" -ne 0 ] || { cat source-verdict.txt; bad "install.sh built where gh refused the SOURCE's attestation"; }
          said source-verdict.txt "SOURCE's build attestation does not verify (X The attestation is signed by a workflow this check does not accept)" \
            "install.sh did not refuse the SOURCE's attestation"
          said source-verdict.txt "The file may be corrupt, or tampered with on its way here" "install.sh did not say SOURCE may be tampered with"
          for name in source-wrong source-bench source-verdict; do
            if grep -qF '== The Rust toolchain' "$name.txt"; then cat "$name.txt"; bad "install.sh reached the toolchain before checking the source ($name)"; fi
            [ ! -e "$tmp/$name/cadence$exe" ] || bad "a binary was installed from a source it refused ($name)"
          done
