            "install.sh did not stop the binary at its deadline"
          if grep -qF 'Building from source' hang.txt; then cat hang.txt; bad "install.sh built from source after a binary hung"; fi
          child=$(tr -d '\r' < "$tmp/hang-child")
          if [ "$RUNNER_OS" = Windows ]; then
            if tasklist //FI "PID eq $child" | grep -q ping; then bad "the hanging binary's child $child outlived it"; fi
          else
            if kill -0 "$child" 2> /dev/null; then kill "$child"; bad "the hanging binary's child $child outlived it"; fi
          fi

          rc=0
          CADENCE_RELEASES_URL="$url/good" CADENCE_TABLES_URL="$url/badtables" bash install.sh --yes --test-urls --tables \
            --version "$v" --dir "$tmp/bad-tables" > bad-tables.txt 2>&1 || rc=$?
          [ "$rc" -ne 0 ] || { cat bad-tables.txt; bad "install.sh took a table list naming a path outside its folder"; }
          said bad-tables.txt "the published checksums name '../K.rtbw', which is not a table's file name, so nothing was downloaded" \
            "install.sh did not refuse the table name"

          # A release whose SOURCE names the tag's commit, held to its SHA256SUMS and to its attestation
          # where gh can check one, builds with GitHub's API refusing, which a build from source never
          # asks; the checks come before the toolchain, and the end claims no SHA-256 for a build.
          rc=0
          from_source source-right source-right setup CADENCE_API_URL="$url/forbidden/releases" || rc=$?
          [ "$rc" -eq 0 ] || { cat source-right.txt; bad "install.sh exited $rc on a release whose SOURCE names the tag's commit"; }
          said source-right.txt "The source's bench.txt says $count, as the release's does." "install.sh did not hold the source's bench.txt to the release's"
          said source-right.txt "Release $v's SOURCE matches its SHA256SUMS." "install.sh did not hold SOURCE to SHA256SUMS"
          said source-right.txt "Its build attestation was not verified: gh could not check it (" "install.sh did not ask gh about SOURCE"
          said "$tmp/gh-args-source-right" "SOURCE --repo grounzero/cadence --cert-identity https://github.com/grounzero/cadence/.github/workflows/release.yml@refs/tags/$v" \
            "gh was not asked about SOURCE for the release workflow at this version's tag"
          said source-right.txt "Release $v's SOURCE names commit $TAG_COMMIT, the one fetched." "install.sh did not check the commit SOURCE names"
          if grep -qF "GitHub's API did not answer" source-right.txt; then bad "install.sh asked GitHub's API to build from source"; fi
          said source-right.txt "It was built here from source at the tag $v, so its bench is the check it passed." \
            "install.sh did not say how the build was checked"
          if grep -qF 'its SHA-256 and its bench are the checks it passed' source-right.txt; then bad "install.sh claimed a SHA-256 for a build"; fi
          named=$(grep -n "SOURCE names commit" source-right.txt | head -n 1 | cut -d: -f1)
          tools=$(grep -n '== The Rust toolchain' source-right.txt | head -n 1 | cut -d: -f1)
          [ -n "$named" ] && [ -n "$tools" ] && [ "$named" -lt "$tools" ] || bad "install.sh did not check the source before the toolchain"
          cmp "$tmp/source-right/cadence$exe" "$tmp/releases/good/$v/$RELEASE_FILE" || bad "the stand-in build was not installed"
          # The stand-in rustup holds no toolchain, so the one this run installed is recorded for the
          # uninstall to name.
          if [ "$RUNNER_OS" != Windows ]; then
            grep -qF "installed_toolchain=Rust $(git show "$v:rust-toolchain.toml" | sed -n 's/^channel *= *"\(.*\)"$/\1/p'), which 'rustup toolchain uninstall" \
              "$tmp/source-right-home/.local/share/cadence/install-state" || bad "the toolchain the build installed was not recorded"
          fi
