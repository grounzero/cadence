            local name=$1 files=$2 gh=$3
            shift 3
            mkdir -p "$tmp/$name-home"
            env HOME="$tmp/$name-home" USERPROFILE="$(cygpath -w "$tmp/$name-home" 2> /dev/null || echo "$tmp/$name-home")" \
              PATH="$tmp/fake-gh:$tmp/fake-rust:$PATH" FAKE_GH="$gh" FAKE_GH_ARGS="$tmp/gh-args-$name" \
              FAKE_BUILT="$tmp/releases/good/$v/$RELEASE_FILE" FAKE_EXE=$exe FAKE_HOST=$RUST_HOST CADENCE_RELEASES_URL="$url/$files" \
              "$@" bash install.sh --yes --test-urls --source --version "$v" --dir "$tmp/$name" > "$name.txt" 2>&1
          }
          count=$(tr -d '[:space:]' < "$tmp/releases/good/$v/bench.txt")
          # Nothing reads a release's notes, so notes naming another commit, or none, build as others do.
          for notes in moved api-edited; do
            rc=0
            from_source "notes-$notes" good setup CADENCE_API_URL="$url/$notes/releases" || rc=$?
            [ "$rc" -eq 0 ] || { cat "notes-$notes.txt"; bad "install.sh exited $rc where the release's notes were edited ($notes)"; }
            said "notes-$notes.txt" "The tag $v names commit $TAG_COMMIT, the one fetched." "install.sh did not check the tag's commit ($notes)"
            if grep -qF 'the release names' "notes-$notes.txt"; then cat "notes-$notes.txt"; bad "install.sh read the release's notes ($notes)"; fi
            cmp "$tmp/notes-$notes/cadence$exe" "$tmp/releases/good/$v/$RELEASE_FILE" || bad "the stand-in build was not installed ($notes)"
          done
