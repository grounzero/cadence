# Release binaries from a version tag: six builds, their checksums and a provenance attestation for
# each, drafted for publishing by hand. A manual run or a change to this file only builds and checks,
# unless a manual run names an existing tag and asks for the draft, which re-runs a failed release.

name: release

on:
  push:
    # A `+n` tag names a base for a test and is not a release, so it never matches.
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing version tag to build with this workflow; empty builds the ref run from
        required: false
        default: ''
      draft:
        description: With a tag, attest the binaries and draft its release, replacing an earlier draft
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Refused before anything builds: a release must be an annotated tag on the commit it names, equal
  # to the workspace version, with a changelog entry.
  version:
    name: the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      expected: ${{ steps.read.outputs.expected }}
      tag: ${{ steps.read.outputs.tag }}
      ref: ${{ steps.read.outputs.ref }}
      commit: ${{ steps.read.outputs.commit }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          fetch-depth: 0

      - id: read
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -eu
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"$/\1/p' Cargo.toml)
          [ -n "$version" ] || { echo "::error::no workspace version in Cargo.toml"; exit 1; }
          tag=""
          [ "$GITHUB_REF_TYPE" != tag ] || tag="$GITHUB_REF_NAME"
          if [ -n "$INPUT_TAG" ]; then
            [ -z "$tag" ] || [ "$tag" = "$INPUT_TAG" ] \
              || { echo "::error::run at the tag $tag and asked for $INPUT_TAG"; exit 1; }
            tag="$INPUT_TAG"
          fi
          publish=false
          if [ -n "$tag" ]; then
            echo "$tag" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' \
              || { echo "::error::$tag is not a version tag"; exit 1; }
            git fetch --force origin "+refs/tags/$tag:refs/tags/$tag"
            [ "$(git cat-file -t "refs/tags/$tag")" = tag ] \
              || { echo "::error::$tag is not an annotated tag"; exit 1; }
            [ "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)" ] \
              || { echo "::error::$tag does not name the commit checked out"; exit 1; }
            [ "$tag" = "$version" ] \
              || { echo "::error::$tag is not the workspace version, $version"; exit 1; }
            awk -v h="## [$version]" '$0 == h || index($0, h " - ") == 1 {found = 1} END {exit !found}' \
              CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $version"; exit 1; }
            expected="$version"
            if [ "$GITHUB_EVENT_NAME" = push ] || [ "$INPUT_DRAFT" = true ]; then
              publish=true
            fi
            echo "the tag $tag, built by the workflow at $GITHUB_REF; draft release: $publish"
          else
            [ "$INPUT_DRAFT" != true ] || { echo "::error::a draft needs a tag"; exit 1; }
            expected="$version-dev-$(git rev-parse --short HEAD)"
            echo "a dry run on $GITHUB_REF: built and checked, published nowhere"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=${tag:+refs/tags/$tag}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "the binaries must call themselves Cadence $expected"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The build a rating list is asked to rate.
          - name: windows-x86-64-avx2
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
          - name: windows-x86-64-generic
            os: windows-latest
            target: x86_64-pc-windows-msvc
            config: .cargo/x86-64-generic.toml
            exe: .exe
          # 22.04 rather than the latest, so the binaries ask for an older glibc.
          - name: linux-x86-64-avx2
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-x86-64-generic
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            config: .cargo/x86-64-generic.toml
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
    env:
      CONFIG_ARG: ${{ matrix.config && format('--config {0}', matrix.config) || '' }}
      EXPECTED: ${{ needs.version.outputs.expected }}
    defaults:
      run:
        shell: bash

    steps:
      # The full history and the tags, since the binary reads its version from the tag at HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          fetch-depth: 0

      - name: The annotated tag, fetched as itself
        if: needs.version.outputs.tag != ''
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: git fetch --force origin "+refs/tags/$TAG:refs/tags/$TAG"

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose

      - name: Assert the runner is the architecture we think it is
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "host triple: $host"
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "::error::expected ${{ matrix.target }}, runner is $host"
            exit 1
          fi

      - name: build --release
        run: cargo build --release -p cadence-engine --bin cadence $CONFIG_ARG

      # As in CI: the features each crate was compiled with resolve to the baseline plus POPCNT,
      # with Windows's static C runtime on both sides of the comparison.
      - name: Assert the generic binary uses only the baseline features and POPCNT
        if: matrix.config != ''
        run: |
          case "${{ matrix.target }}" in
            *-windows-msvc) wanted=+popcnt,+crt-static ;;
            *) wanted=+popcnt ;;
          esac
          cargo clean --release -p cadence-core
          cargo build --release -p cadence-engine --bin cadence -v --color never $CONFIG_ARG \
            > release.log 2>&1 || { cat release.log; exit 1; }
          base=$(rustc --print cfg --target ${{ matrix.target }} -C target-feature=$wanted \
            | grep target_feature | sort)
          grep -E '^ +Running `.*rustc(\.exe)? .*--crate-name ' release.log > invocations.txt || true
          for crate in cadence_core cadence_nnue cadence_engine cadence; do
            if ! grep -q -- "--crate-name $crate " invocations.txt; then
              echo "::error::no rustc invocation for $crate in the release build log"
              exit 1
            fi
          done
          n=0
          while read -r line; do
            set --
            for f in $(echo "$line" | grep -oE "target-feature=[^ '\`\"]+"); do set -- "$@" -C "$f"; done
            got=$(rustc --print cfg --target ${{ matrix.target }} "$@" | grep target_feature | sort)
            if [ "$got" != "$base" ]; then
              name=$(echo "$line" | grep -oE -- '--crate-name [^ ]+')
              echo "::error::$name resolves to $(echo $got) and not the baseline plus POPCNT"
              exit 1
            fi
            n=$((n + 1))
          done < invocations.txt
          echo "$n rustc invocations, every one at the baseline plus POPCNT: $(echo $base)"

      # A build that would call itself anything but the expected version fails here rather than
      # ships.
      - name: The UCI id names the version
        run: |
          out=$(printf 'uci\nisready\nquit\n' | ./target/release/cadence)
          echo "$out"
          echo "$out" | grep -qx "id name Cadence $EXPECTED" \
            || { echo "::error::the binary does not call itself Cadence $EXPECTED"; exit 1; }
          echo "$out" | grep -qx 'uciok' || { echo "::error::no uciok"; exit 1; }
          echo "$out" | grep -qx 'readyok' || { echo "::error::no readyok"; exit 1; }

      - name: bench against bench.txt
        run: |
          last=$(./target/release/cadence bench | tail -n 1)
          echo "$last"
          got=$(echo "$last" | awk '{print $1}')
          expected=$(tr -d '[:space:]' < bench.txt)
          if [ "$got" != "$expected" ]; then
            echo "::error::cadence bench is $got nodes but bench.txt says $expected"
            exit 1
          fi
          printf '### %s\n%s\n' "${{ matrix.name }}" "$last" >> "$GITHUB_STEP_SUMMARY"

      - name: Name the binary
        run: |
          mkdir dist
          cp "target/release/cadence${{ matrix.exe }}" \
            "dist/cadence-$EXPECTED-${{ matrix.name }}${{ matrix.exe }}"
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # The six together, summed, on every run, so a dry run checks what a release would assemble.
  assemble:
    name: the six together
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Six binaries and their checksums
        shell: bash
        run: |
          cd dist
          ls -l
          n=$(ls cadence-* | wc -l)
          [ "$n" -eq 6 ] || { echo "::error::$n binaries and not six"; exit 1; }
          sha256sum cadence-* | tee SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

  # Only at a pushed tag or a run asking for the draft, and the only job that may write: it attests
  # each binary and drafts the release, which is published by hand.
  release:
    name: the draft release
    needs: [version, assemble]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum cadence-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/cadence-*

      # A re-run replaces an earlier draft of the same version, hand edits included, and refuses once the
      # release is published.
      - name: Draft the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          set -eu
          found=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$VERSION\") | \"\(.id) \(.draft)\"")
          if echo "$found" | grep -q ' false$'; then
            echo "::error::$VERSION is published, and a re-run never changes a published release"
            exit 1
          fi
          {
            echo "Cadence $VERSION, built from $COMMIT at the tag $VERSION. Bench: $(tr -d '[:space:]' < bench.txt) nodes."
            echo
            echo "Six binaries: Windows and Linux x86-64, each in an AVX2 build and a generic one for older processors, Linux aarch64 and macOS arm64. SHA256SUMS lists their checksums, and each carries a build provenance attestation: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
            echo
            echo "The macOS binary is not notarized. Clear the quarantine flag with \`xattr -d com.apple.quarantine <file>\`, or build from source."
            echo
            echo "From source: \`git clone https://github.com/$GITHUB_REPOSITORY.git\`, \`git checkout $VERSION\`, \`cargo build --release\`; the binary is \`target/release/cadence\`."
            echo
            awk -v h="## [$VERSION]" '$0 == h || index($0, h " - ") == 1 {on = 1; next} on && /^## \[/ {exit} on' \
              CHANGELOG.md
          } > notes.md
          cat notes.md
          echo "$found" | while read -r id _; do
            [ -n "$id" ] || continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            echo "replaced the earlier draft $id"
          done
          gh release create "$VERSION" --draft --verify-tag --title "Cadence $VERSION" \
            --notes-file notes.md dist/cadence-* dist/SHA256SUMS LICENSE
