# A diagnostic, run by hand: datagen's games at a hard node count and at several soft ones, with
# the nodes each move's search spent, to set the soft count whose mean matches the hard one.

name: diag-soft-nodes

on:
  workflow_dispatch:
  push:
    branches: [diag-soft-nodes]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  sample:
    name: sample
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          nproc

      - name: Build
        run: cargo build --locked --release -p cadence-engine --features packed-datagen --example diag_soft_nodes

      - name: Soft counts near an equal mean, under a cap of 50,000
        run: target/release/examples/diag_soft_nodes 400 4 50000 1000 1250 1500 1750 2000

      - name: Soft 1,500 under a cap of 20,000
        run: target/release/examples/diag_soft_nodes 400 4 20000 1500

      - name: Soft 1,500 under a cap of 10,000
        run: target/release/examples/diag_soft_nodes 400 4 10000 1500
