# A diagnostic, run by hand: builds a match between two node settings for datagen's searches, for
# the Mac to run, and plays a few pairs here as a check that it runs.

name: diag-soft-nodes

on:
  workflow_dispatch:
  push:
    branches: [diag-soft-nodes]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  match:
    name: match build
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          sysctl -n machdep.cpu.brand_string hw.ncpu

      - name: Build
        run: cargo build --locked --release -p cadence-engine --features packed-datagen --example diag_soft_match

      - name: A few pairs
        run: target/release/examples/diag_soft_match 20 3 1690 50000 0 5000

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diag-soft-match-aarch64-apple-darwin
          path: target/release/examples/diag_soft_match
          retention-days: 7
