# A reading on this branch only, in release.

name: trace-reading

on:
  push:
    branches: [diag-kqk-trace]

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Read
        env:
          TRACE_MODE: ${{ matrix.mode }}
        run: cargo test --release --locked -p cadence-engine --test trace_reading -- --ignored --nocapture --exact store_rules
