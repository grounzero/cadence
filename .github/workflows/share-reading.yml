# A reading on this branch only, in release.

name: share-reading

on:
  push:
    branches: [diag-node-share]

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test: [ladder_with_the_net, ladder_with_the_handcrafted_evaluation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Read
        env:
          SHARE_DEPTH: '20'
        run: cargo test --release --locked -p cadence-engine --test one_legal_reading -- --ignored --nocapture --exact ${{ matrix.test }}
