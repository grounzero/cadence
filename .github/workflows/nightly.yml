# The tier of tests too expensive to run on every merge: the deep perft
# values -- startpos d6-d7, Kiwipete d6, positions 3-6 to d6/d7 -- which are
# the `#[ignore]`d half of core/tests/standard_perft.rs. Roughly 2.2e10 leaf
# nodes, counted in bulk.
#
# Ubuntu only. Perft is architecture-independent and the macOS runner bills
# at ten times the rate for the same answer. The fast tier, which runs on both
# architectures on every push, is what catches a platform difference.
#
# This is not the one-time completion run. That is startpos d7 and Kiwipete d6
# run once by hand, against the same corpus values these tests use, so the two
# differ in when they run and not in what they assert. What the by-hand run
# adds is a date, a machine and a wall clock, none of which this repository
# records. This job is the recurring half: it catches a later regression.
#
# The dependency audit at the end shares the schedule and nothing else.

name: nightly

on:
  schedule:
    # 03:17 UTC. Off the hour deliberately: GitHub drops scheduled runs at
    # popular times under load, and :00 is the most popular time there is.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  deep:
    name: deep perft (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose

      # Release: the fast tier runs in the dev profile on every push, so the
      # release build is exercised too, and the deep values would take hours
      # unoptimised.
      - name: Build the deep tier
        run: cargo test --locked -p cadence-core --release --test standard_perft --no-run

      # The ignored tests are listed first and every one must pass, so a tier that no longer
      # compiles any test fails rather than reporting nothing run as success.
      - name: Deep perft
        shell: bash
        run: |
          listed=$(cargo test --locked -p cadence-core --release --test standard_perft \
            -- --ignored --list 2>/dev/null | grep -c ': test$')
          start=$(date +%s)
          cargo test --locked -p cadence-core --release --test standard_perft -- --ignored --nocapture 2>&1 | tee deep.log
          status=${PIPESTATUS[0]}
          elapsed=$(( $(date +%s) - start ))
          passed=$(grep -h '^test result:' deep.log | awk '{n += $4} END {print n + 0}')
          echo "deep tier wall-clock: ${elapsed}s, $passed of $listed passed"
          {
            echo "### deep perft"
            echo "wall-clock: ${elapsed}s, $passed of $listed passed"
            grep -h '^test ' deep.log || true
            grep -h '^test result:' deep.log || true
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$status" -eq 0 ] || exit "$status"
          [ "$listed" -gt 0 ] && [ "$passed" -eq "$listed" ] \
            || { echo "::error::$passed of $listed ignored tests passed"; exit 1; }

  # RustSec's advisories against Cargo.lock, and every licence and source in the dependency tree,
  # held to deny.toml. Nightly because an advisory arrives without any change here.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny 0.20.2
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Advisories, licences, bans and sources
        run: cargo deny --locked check

      # A package outside the workspace holding a smallvec that RustSec lists and crates.io has not
      # yanked: the check must fail on it by that advisory, or the clean read above proves nothing.
      - name: The check fails on a crate RustSec lists
        run: |
          dir="$RUNNER_TEMP/planted"
          mkdir -p "$dir/src" && touch "$dir/src/lib.rs"
          printf '[package]\nname = "planted"\nversion = "0.0.0"\nedition = "2021"\nlicense = "MIT"\npublish = false\n\n[dependencies]\nsmallvec = "=1.6.0"\n' > "$dir/Cargo.toml"
          cargo generate-lockfile --manifest-path "$dir/Cargo.toml"
          status=0
          cargo deny --manifest-path "$dir/Cargo.toml" --config deny.toml check advisories > planted.log 2>&1 || status=$?
          cat planted.log
          [ "$status" -ne 0 ] || { echo "::error::the advisory check passed a crate RustSec lists"; exit 1; }
          grep -q 'RUSTSEC-2021-0003' planted.log || { echo "::error::the check failed, but not on RUSTSEC-2021-0003"; exit 1; }
