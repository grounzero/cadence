[package]
name         = "cadence-engine"
description  = "Search and UCI for Cadence"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "cadence"
path = "src/main.rs"

[features]
default = []
# The search's diagnostic counts, which only tests read; a release build keeps none of them.
counters = []

[dependencies]
cadence-core = { path = "../core" }
cadence-nnue = { path = "../nnue" }
shakmaty = { version = "=0.30.2", default-features = false }
shakmaty-syzygy = { version = "=0.28.1", default-features = false }

# Every test build turns the counts on, so no gate that reads one is skipped for a missing flag.
[dev-dependencies]
cadence-engine = { path = ".", features = ["counters"] }

[lints]
workspace = true
