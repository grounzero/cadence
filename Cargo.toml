[workspace]
members  = ["core", "nnue", "engine", "tools"]
exclude  = ["xtask"]
resolver = "3"

[workspace.package]
# One version for the whole workspace. The four crates are built from one
# tree at one commit, so they must not be able to disagree about which
# version they are; only `cadence-engine`'s reaches the UCI id, and a
# per-crate version would leave the other three frozen while it advanced.
# The minor marks a milestone and is cut when that milestone opens; the patch
# counts the changes that passed a test inside it. The archived binary is
# still what identifies a promotion, because a version says which release a
# build is and not what it played like.
version      = "0.4.7"
edition      = "2024"
rust-version = "1.98"
license      = "GPL-3.0-or-later"
authors      = ["Michael Grounds"]
repository   = "https://github.com/grounzero/cadence"

# `unsafe_code = "forbid"` is deliberately NOT here. A Cargo-level `forbid`
# arrives as `--forbid unsafe_code` on the rustc command line and cannot be
# relaxed by anything downstream, so a workspace-wide forbid would make
# `cadence-nnue`'s SIMD intrinsics unimplementable. The
# attribute is therefore set per crate, in the crate root, where it is visible
# to a reader of the file it governs.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allowed back: these fire constantly in engine code and drown real findings.
cast_possible_truncation = "allow"   # u8 square arithmetic is the domain
cast_sign_loss           = "allow"
similar_names            = "allow"   # from_sq/to_sq, rook_from/rook_to
inline_always            = "allow"
unreadable_literal       = "allow"   # magics, zobrist seeds

[profile.release]
lto           = "fat"
codegen-units = 1
panic         = "abort"
# Required by the bench determinism contract. Note that Cargo silently ignores
# `panic = "abort"` for the test profile; verified on 1.97.1 to compile, run
# and pass with no warning.
incremental   = false

# The test profile is the dev profile with light optimisation. Debug
# assertions and overflow checks stay on; what changes is that `cargo test`
# runs the engine at a usable speed -- the full bench at its real depth takes
# about a second in this profile and fifteen unoptimised, and the bench gate
# runs it several times. Measured on the M5 Max: the whole fast tier takes
# 23 s with the bench gate in it at opt-level 1, against 17 s before the gate
# existed at opt-level 0. The test binaries and the `cadence` binary the
# integration tests spawn are both built with this profile.
[profile.test]
opt-level = 1
